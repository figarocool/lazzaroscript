n292=  .disable #assault
n293=  if (%assault.type == -icmp) { 
n294=    echo 4 -a [Assault]
n295=    echo 4 -a Obiettivo: [[ $+ %Assault.Nick $+ ( $+ %assault.ip $+ )]
n296=    echo 4 -a Tipo: Flood ICMP
n297=    echo 4 -a N Pacchetti: %assault.packets
