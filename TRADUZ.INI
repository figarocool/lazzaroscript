[script]
n0=on ^*:JOIN:#:{
n1=  echo 3 -t $chan *** $nick ( $+ $address $+ ) si è unito a $chan
n2=  haltdef
n3=}
n4=on ^*:BAN:#:echo 3 -t $chan *** $nick ( $+ $address $+ ) ha bandito: $banmask | haltdef
n5=on ^*:UNBAN:#:echo 3 -t $chan *** $nick ( $+ $address $+ ) ha riammesso: $banmask | haltdef
n6=on ^*:op:#:echo 3 -t $chan *** $nick ha 'oppato' $opnick | haltdef
n7=on ^*:deop:#:echo 3 -t $chan *** $nick ha 'deoppato' $opnick | haltdef
n8=on ^*:voice:#:echo 3 -t $chan *** $nick ha dato 'voice' a $vnick | haltdef
n9=on ^*:devoice:#:echo 3 -t $chan *** $nick ha tolto il 'voice' da $vnick | haltdef
n10=on ^*:serverop:#:echo 3 -t $chan *** $opnick è stato 'oppato' dal server $nick | haltdef
n11=on ^*:INVITE:#:/echo 6 -at *** $nick ( $+ $address $+ ) ti invita ad andare su $chan
n12=on ^*:KICK:#:/echo 2 -t $chan *** $nick ha cacciato $knick: $1- | haltdef
n13=on ^*:MODE:#:/echo 3 -t $chan *** $nick ha impostato i modi: $1- | haltdef
n14=on ^*:SERVERMODE:#:/echo 3 -t $chan *** Il server $nick ha impostato i modi: $1- | haltdef
n15=on ^*:NICK:{
n16=  %tmp.x = 1
n17=  :nextcomch
n18=  echo 2 -t $comchan($nick,%tmp.x) *** $nick ( $+ $address $+ ) ora è conosciuto come $newnick
n19=  inc %tmp.x 1
n20=  if (%tmp.x <= $comchan($nick,0)) goto nextcomch
n21=  %tmp.x = 1
n22=  :nextcomch
n23=  echo 2 -t $comchan($newnick,%tmp.x) *** $nick ( $+ $address $+ ) ora è conosciuto come $newnick
n24=  inc %tmp.x 1
n25=  if (%tmp.x <= $comchan($newnick,0)) goto nextcomch
n26=  /echo 2 -st *** $nick ( $+ $address $+ ) ora è conosciuto come $newnick | unset %tmp.x | haltdef
n27=}
n28=on ^*:PART:#:/echo 3 -t $chan *** $nick ( $+ $address $+ ) ha lasciato $chan $+ : $1- | haltdef
n29=on ^*:QUIT:{
n30=  %tmp.x = 1
n31=  :nextcomch
n32=  echo 2 -t $comchan($nick,%tmp.x) *** $nick ( $+ $address $+ ) si è disconnesso da  IRC: $1-
n33=  inc %tmp.x 1
n34=  if (%tmp.x <= $comchan($nick,0)) goto nextcomch
n35=  /echo 2 -st *** $nick ( $+ $address $+ ) si è disconnesso da IRC: $1- | unset %tmp.x | haltdef
n36=}
n37=on ^*:TOPIC:#:/echo 3 $chan *** $nick ha cambiato l'argomento in: $1- | haltdef
