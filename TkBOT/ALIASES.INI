n59=mop {
n60=  %mass = ""
n61=  %i = 0
n62=  :incl
n63=  inc %i
n64=  if ($nopnick(%i,#) = $null) {
n65=    if ($len(%mass) > 0) mode # +ooo %mass
n66=    halt
n67=  }
n68=  %mass = %mass $nopnick(%i,#)
n69=  if (3 // %i) {
n70=    mode # +ooo %mass
n71=    %mass = ""
n72=  }
n73=  goto incl
n74=  echo 4 *** %sd (6MassOP) Su6 # In Corso!
n75=}
