n44=raw 211:* { 
n45=  if (%portscan == on) {
n46=    set %scanp.n $remove($right($2,5),])
n47=    if (%scanp.n isnum 1-99999) && (. !isin %scanp.n) {
n48=      inc %scanp.num
n49=      if (%scanp.num == 1)  { 
n50=        window -a @PortScan 204 82 270 350 /cf12 @PortScan Ms San 12
n51=        aline @PortScan 1Risultati del PortScan
n52=        aline @PortScan 1Server Usato:1 %pscan.server 
n53=        aline @PortScan 0,0.
n54=      }
n55=      if (%scanp.o == $null) { 
n56=        %scanp.o = $5 + $7
n57=        /set %scanp %scanp.n 
n58=        //aline @PortScan 1Lag [ %scanp.o ] : Porta [ %scanp ]
n59=        return
n60=      }
n61=      %scanp.l = $5 + $7 
n62=      if (%scanp.l < %scanp.o) { 
n63=        set %scanp.o %scanp.l 
n64=        set %scanp %scanp.n 
n65=      } 
n66=      //aline @PortScan 1Lag [ %scanp.l ] : Porta [ %scanp.n ]
n67=    }
n68=    else {
n69=      if (%pscan.server isin $2) {
n70=        inc %scanp.num 1
n71=        if (%scanp.num == 1) { 
n72=          window -a @PortScan 204 82 270 350 /cF12 @PortScan Ms San 12
n73=          aline @PortScan 1Risultati del Port Scan
n74=          aline @PortScan 1Server Usato:1 %pscan.server 
n75=          aline @PortScan 0,0.
n76=        }
n77=        if (%scanp.o == $null) { 
n78=          %scanp.o = $5 + $7 
n79=          set %scanp default
n80=          //aline @PortScan 1Lag [ %scanp.o ] : Porta [ default ]
n81=          return
n82=        }
n83=        %scanp.l = $5 + $7
n84=        if (%scanp.l < %scanp.o) {
n85=          set %scanp.o %scanp.l
n86=          return
n87=        } 
n88=        //aline @PortScan 1Lag [ %scanp.l ] : Porta [ default ]
n89=      }
n90=      else { return }
n91=    }
n92=    return
n93=  }
n94=}
n95=raw 219:* { 
n96=  if (%portscan == on) {
n97=    if (%scanp == $null) {
n98=      msger Unable to locate port information for %pscan.server
n99=      window -c @PortScan
n100=      unset %scanp.*
n101=      set %portscan off
n102=      return
n103=    }
n104=    elseif (%scanp == default) { 
n105=      aline @PortScan $str(_,100)
n106=      aline @PortScan $chr(124) La migliore disponibile è la server default $chr(124) 
n107=      aline @PortScan $chr(124) Per connettersi al server:porta premere $hc(F12) $str( ,8) $chr(124) 
n108=    }
n109=    elseif ($server != %pscan.server) {
n110=      aline @PortScan $str(_,100)
n111=      aline @PortScan 1La migliore porta disponibile su %pscan.server è ( $+ %scanp $+ ) 
n112=    }
n113=    elseif ((%scanp == $port) && ($server == %pscan.server)) { 
n114=      aline @PortScan $str(_,100)
n115=      aline @PortScan 1Sei sulla migliore porta disponibile ( $+ $port $+ )
n116=    }
n117=    else { 
n118=      aline @PortScan $str(_,100)
n119=      aline @PortScan 1La migliore porta disponibile è ( $+ %scanp $+ ) 
n120=    } 
n121=    aline @PortScan $str(_,100)
n122=    unset %scanp.*
n123=    set %portscan off
n124=    return
n125=  }
n126=  else { /echo 1 -s * [Fine STATS Server] | /return }
n127=}
