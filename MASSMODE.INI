n77=#CLONESPROT on
n78=on @1:JOIN:#:{
n79=  if (%clones != OFF) {
n80=    inc %joins $+ $chan $+ $site 1
n81=    if (%joins [ $+ [ $chan [ $+ [ $site ] ] ] ] == 4) {
n82=      .timer1? off 
n83=      if (%filterkick == OFF) {
n84=        .enable #filterkick
n85=        set %filterkick ON
n86=        echo 5 -a 4Filter Kick automaticamente ø12Attivatoø %script
n87=        .timer10 1 50 .disable #filterkick
n88=        .timer11 1 50 set %filterkick OFF
n89=        .timer12 1 50 echo 5 -a 4Filter Kick automaticamente ø12Disattivatoø %script
n90=      }
n91=      raw -q mode $chan +mi+b $wildsite
n92=      raw -q kick $chan $nick :4® PÎZzÂ §©rÎpT© 3.0 SstaR  %mjmsg [ $+ $site $+ ]
n93=      unset %joins [ $+ [ $chan [ $+ [ $site ] ] ] ]
n94=      set %wsite $wildsite
n95=      echo 5 -a 12PERICOLO!: Mass-join da4 $site su $chan %script
n96=      halt
n97=    }
n98=    elseif (%joins [ $+ [ $chan [ $+ [ $site ] ] ] ] == 1) .timer 1 3 unset %joins [ $+ [ $chan [ $+ [ $site ] ] ] ]
n99=    if ($ialchan($address($nick,2),$chan,0) == $calc(%clonumb + 1)) {    
