n60=#MASSKICK on
n61=on @1!:KICK:#:{
n62=  if (($level($address($nick,3)) != 3) && ($level($address($nick,3)) != 4) && ($address($nick,3) !isauto $chan)) {
n63=    if $address($knick,2) != %kick.last {
n64=      inc %kicks $+ $chan $+ $nick 1
n65=    }
n66=    set %kick.last $address($knick,2)
n67=    if (%kicks [ $+ [ $chan [ $+ [ $nick ] ] ] ] == 4) {
n68=      raw -q kick $chan $nick :4® PÎZzÂ §©rÎpT© 3.0 SstaR  %mkmsg 
n69=      unset %kicks $+ $chan $+ $nick
n70=      echo 5 -a 12PERICOLO!: Mass-kick tentato da $nick su $chan %script
n71=    }
