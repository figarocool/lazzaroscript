[script]
n0=;%%%%%%%%%%%%%%%%%%%%%%  ALIASES  %%%%%%%%%%%%%%%%%%%%%%
n1=alias ircq {
n2=  /window -p +b @IRCQ 0 0 93 352 @IRCQ
n3=  /drawpic @IRCQ 0 0  $mircdirircq\ircq.bmp
n4=  /drawpic @IRCQ 8 25 $mircdirircq\online.bmp
n5=  /refreshircq
n6=  /drawtext -o @IRCQ 0 Arial 16 7 3 IRCQ
n7=}
n8=alias offline {
n9=  /drawpic @IRCQ 8 %offline  $mircdirircq\offline.bmp
n10=}
n11=alias name {
n12=  /drawrect @IRCQ 1 1 10 %y 12 12
n13=  /drawfill @IRCQ 0 1 11 $calc(%y + 1)
n14=  /drawtext @IRCQ 1 Arial 15 26 $calc(%y - 1) $1
n15=}
n16=alias refreshircq {
n17=  set %temp 0
n18=  set %y 38
n19=  :on
n20=  inc %temp 1
n21=  if ($gettok(%ircqon,%temp,32) != $null) {
n22=    /name $gettok(%ircqon,%temp,32)
n23=    inc %y 16
n24=    goto on
n25=  }
n26=  drawpic @IRCQ 8 %y  $mircdirircq\offline.bmp
n27=  inc %y 18
n28=  set %temp 0
n29=  :off
n30=  inc %temp 1
n31=  if ($gettok(%ircqoff,%temp,32) != $null) {
n32=    name $gettok(%ircqoff,%temp,32)
n33=    inc %y 16
n34=    goto off
n35=  }
n36=  unset %namekeep
n37=}
n38=alias ircqtime {
n39=  if ($gettok($time,1,58) > 12) { set %time1 $calc($gettok($time,1,58) - 12) | set %ampm pm }
n40=  if ($gettok($time,1,58) < 12) { set %time1 $gettok($time,1,58) | set %ampm am }
n41=  return $day, %time1 $+ : $+ $gettok($time,2,58) %ampm
n42=}
n43=alias ircqmessage { /.msg $$1 IRCQ Message: $$?="Message to $1 $+ :" }
n44=alias onnum { return $int($calc(( $1 - 22 ) / 16)) }
n45=alias offnum { return $int($calc(( ( ( $1 - 56 ) - ( $gettok(%ircqon,0,32) * 16 ) ) / 16 ) + 1)) }
n46=alias ircqonlinetest { 
n47=  if (%ircqnick isin %ircqonlinealert) {
n48=    return on 
n49=  }
n50=  if (%ircqnick !isin %ircqonlinealert) { 
n51=    return off 
n52=  } 
n53=}
n54=alias ircqoptions {
n55=  /window -l13 @Options 500 0 250 200 /ircqoption
n56=  aline -l @Options Aggiungi utente
n57=  aline -l @Options Modifica informazioni personali
n58=  aline -l @Options Imposta Away ( %ircqaway )
n59=  aline -l @Options Inposta Pager %ircqp
n60=  aline -l @Options Informazioni su IRCQ
n61=  aline -l @Options Chiudi IRCQ
n62=}
n63=alias ircqoption {
n64=  if (Aggiungi isin $sline(@Options,1)) { 
n65=    if ($ircqnicks < 13) { 
n66=      /notify $$?="Aggiungi Utente a IRCQ:" 
n67=      %ircqoff = %ircqoff $! 
n68=      /ircq
n69=      /write $mircdir\ircq\users\ $+ $! $+ .txt Message History 
n70=    } 
n71=    else { /echo -s Impossibile aggiungere l'utente all'Elenco Contatti di IRCQ: Troppi utenti } 
n72=  }
n73=  if (Away isin $sline(@Options,1)) { /ircqaway }
n74=  if (Pager isin $sline(@Options,1)) { /ircqpager }
n75=  if (Modifica isin $sline(@Options,1)) { /ircqinfo }
n76=  if (su isin $sline(@Options,1)) { /aboutircq }
n77=  if (Chiudi isin $sline(@Options,1)) { /window -c @IRCQ | /window -c @Options }
n78=}
n79=alias ircqnicks {
n80=  if ($gettok(%ircqonline,0,32) = $null) {
n81=    return $gettok(%ircqoff,0,32)
n82=  }
n83=  else {
n84=    return $calc($gettok(%ircqon,0,32) + $gettok(%ircqoff,0,32))
n85=  }
n86=}
n87=alias closeinfo { /window -c @INFO }
n88=alias ircqinfo {
n89=  /window -l13 @info 500 0 200 200 /ircqinfo1
n90=  aline -l @info Visualizza informazioni
n91=  aline -l @info Modifica indirizzo di posta elettronica
n92=  aline -l @info Modifica home page
n93=  aline -l @info Modifica nome
n94=  aline -l @info Modifica sesso
n95=  aline -l @info Modifica eta
n96=}
n97=alias ircqinfo1 {
n98=  if (Info isin $sline(@info,1)) { /viewinfo }
n99=  if (posta isin $sline(@info,1)) { /set %ircqmail $$?="Indirizzo di posta elettronica (None for Nothing):" }
n100=  if (home isin $sline(@info,1)) { /set %ircqhomepage $$?="Home page (None for Nothing):" }
n101=  if (nome isin $sline(@info,1)) { /set %ircqname $$?="Nome/cognome (Not Entered for Nothing):" }
n102=  if (sesso isin $sline(@info,1)) { /set %ircqgender $$?="Sesso (None for Nothing)" }
n103=  if (eta isin $sline(@info,1)) { /set %ircqage $$?="Età (None for Nothing):" }
n104=}
n105=alias viewinfo {
n106=  /window -l35 @view-info 500 0 307 110
n107=  aline -l @view-info Indirizzo di posta elettronica: %ircqmail
n108=  aline -l @view-info Home page: %ircqhomepage
n109=  aline -l @view-info Nome: %ircqname
n110=  aline -l @view-info Sesso: %ircqgender
n111=  aline -l @view-info Età: %ircqage
n112=}
n113=alias aboutircq {
n114=  /window -p @About 200 200 345 200
n115=  /titlebar @About IRCQ
n116=  /drawpic @About 0 0 $mircdirircq\about.bmp
n117=}
n118=alias ircqaway {
n119=  if %ircqaway == on {
n120=    /set %ircqaway off
n121=    /msg $me IRCQ Message: Away is now off
n122=    /window -c @Options
n123=    /ircqoptions
n124=  }
n125=  else {
n126=    /set %ircqamsg $?="messaggio di assenza"
n127=    /set %ircqaway on
n128=    /window -c @Options
n129=    /ircqoptions
n130=    if %ircqpage == on {halt}
n131=    else { /set %ircqpage on | /set %ircqp off }
n132=  }
n133=}
n134=alias ircqpager {
n135=  if %ircqpage == on { /set %ircqpage off | /set %ircqp on | /window -c @Options | /ircqoptions }
n136=  else { /set %ircqpage on | /set %ircqp off | /window -c @Options | /ircqoptions }
n137=}
n138=;%%%%%%%%%%%%%%%%%%%%%%%%  MENUS  %%%%%%%%%%%%%%%%%%%%%%%%%%%%
n139=menu @IRCQ {
n140=  mouse {
n141=    if (($mouse.x > 4) && ($mouse.x < 54)) && (($mouse.y > 320) && ($mouse.y < 341)) { /drawrect @IRCQ 4 1 8 323 42 15 | set %ircqbutton on }
n142=    if (($mouse.x < 4) || ($mouse.x > 54)) || (($mouse.y < 320) || ($mouse.y > 341)) && (%ircqbutton = on) { /ircq | set %ircqbutton off }
n143=  }
n144=  sclick {
n145=    if (($mouse.x > 9) && ($mouse.x < 82)) && (($mouse.y > 22) && ($mouse.y < 290)) {
n146=      set %name $calc(( $mouse.y - 22 ) / 16)
n147=      set %name2 $int($calc(( ( ( $mouse.y - 56 ) - ( $gettok(%ircqon,0,32) * 16 ) ) / 16 ) + 1))
n148=    }
n149=    if ($gettok(%ircqon,%name,32) != $null) && (%name > 0) {
n150=      ircq
n151=      set %temp $calc(( $int(%name) * 16 ) + 23)
n152=      drawfill @IRCQ 2 1 11 %temp
n153=      set %ircqnick $gettok(%ircqon,%name,32)
n154=    }
n155=    if ($gettok(%ircqoff,%name2,32) != $null) && (%name2 > 0) {
n156=      ircq
n157=      set %temp $calc(( ( $gettok(%ircqon,0,32) * 16 ) + 46 ) + ( %name2 * 16 ))
n158=      drawfill @IRCQ 2 1 11 %temp
n159=      unset %ircqnick
n160=      set %ircqoffnick $gettok(%ircqoff,%name2,32)   
n161=    }    
n162=    if (($mouse.x > 4) && ($mouse.x < 54)) && (($mouse.y > 320) && ($mouse.y < 341)) { /ircqoptions }
n163=    if (($mouse.x > 57) && ($mouse.x < 71)) && (($mouse.y > 6) && ($mouse.y < 16)) { /window -n @IRCQ }
n164=    if (($mouse.x > 71) && ($mouse.x < 85)) && (($mouse.y > 6) && ($mouse.y < 16)) { /window -c @IRCQ }
n165=  }
n166=  dclick { if (%ircqnick != $null) { /ircqmessage %ircqnick } }
n167=  Messaggio { if (%ircqnick != $null) { /ircqmessage %ircqnick } }
n168=  File { if (%ircqnick != $null) { /dcc send %ircqnick } }
n169=  Sito Web { if (%ircqnick != $null) { /msg %ircqnick IRCQ URL: $$?="URL to Send to %ircqnick $+ :" $?="Description of URL:" } }
n170=  Chat { if (%ircqnick != $null) { /dcc chat %ircqnick } }
n171=  -
n172=  Visualizza cronologia { /run $mircdirircq\users\ $+ %ircqnick $+ .txt }
n173=  Informazioni { .ctcp %ircqnick IRCQINFO }
n174=  Elimina { 
n175=    if (%ircqnick != $null) { 
n176=      /notify -r %ircqnick 
n177=      %ircqon = $remtok(%ircqon,%ircqnick,1,32) 
n178=    } 
n179=    else { 
n180=      /notify -r %ircqoffnick 
n181=      %ircqoff = $remtok(%ircqoff,%ircqoffnick,1,32) 
n182=    } 
n183=    ircq 
n184=  }
n185=  Notifica in linea- $ircqonlinetest { 
n186=    if ($ircqonlinetest = off) { %ircqonlinealert = %ircqonlinealert %ircqnick }
n187=    if ($ircqonlinetest = on) { set %ircqonlinetest = %ircqonlinetest %ircqnick }
n188=  }
n189=  Aggiorna:ircq
n190=}
n191=
n192=menu @Incoming {
n193=  sclick {
n194=    if (($mouse.x > 15) && ($mouse.x < 83)) && (($mouse.y > 180) && ($mouse.y < 209)) { /window -c @Incoming | /ircqmessage %message }
n195=    if (($mouse.x > 276) && ($mouse.x < 344)) && (($mouse.y > 180) && ($mouse.y < 209)) { /window -c @Incoming | /dcc chat %message }
n196=    
n197=  }
n198=}
n199=menu @URL {
n200=  sclick {
n201=    if (($mouse.x > 15) && ($mouse.x < 83)) && (($mouse.y > 157) && ($mouse.y < 177)) { /window -c @URL | /ircqmessage %URL }
n202=    if (($mouse.x > 289) && ($mouse.x < 372)) && (($mouse.y > 157) && ($mouse.y < 177)) { /run %URL_ }
n203=    
n204=  }
n205=}
n206=
n207=;%%%%%%%%%%%%%%%%%%%%%%  EVENTS  %%%%%%%%%%%%%%%%%%%%%%%
n208=on 1:NOTIFY:{ if ($nick isin %ircqonlinealert) { /splay  $mircdirircq/Online.wav } | %ircqon = $addtok(%ircqon,$nick,32) | %ircqoff = $remtok(%ircqoff,$nick,1,32) | ircq | halt }
n209=on 1:UNOTIFY { %ircqoff = $addtok(%ircqoff,$nick,32) | %ircqon = $remtok(%ircqon,$nick,1,32) | ircq | halt }
n210=on 1:TEXT:*:?: { 
n211=  if ($1 = IRCQ) && ($2 = Message:) {
n212=    if %ircqaway == on { /msg $nick IRCQ Away: %ircqamsg }
n213=    if %ircqpage == on { /splay $mircdirircq/page.wav }
n214=    /splay $mircdirircq/Message.wav
n215=    /window -p +tb @Incoming 200 200 405 240 @Incoming
n216=    /set %message $nick
n217=    /drawpic @Incoming 0 0 ircq\message.bmp
n218=    /drawtext @Incoming 1 Arial 15 60 18 $nick
n219=    /drawtext @Incoming 1 Arial 15 197 18 $ircqtime
n220=    /drawtext -c @Incoming 1 Arial 12 13 83 353 133 $3-
n221=    /write -i $mircdirircq\message\ $+ $nick $+ .txt $ircqtime $+ :  $3-
n222=    /write -i $mircdirircq\message\ $+ $nick $+ .txt __________________________________________
n223=    halt
n224=  }
n225=  if ($1 = IRCQ) && ($2 = URL:) {
n226=    if %ircqaway == on { /msg $nick IRCQ Away: %ircqamsg } 
n227=    if %ircqpage == on { /splay  $mircdirircq/page.wav }
n228=    /splay  $mircdirircq/URL.wav
n229=    /window -p +tb @URL 200 200 401 256 @URL
n230=    /drawpic @URL 0 0 ircq\URL.bmp
n231=    /drawtext @URL 1 Arial 15 58 18 $nick
n232=    /drawtext @URL 1 Arial 15 197 18 $ircqtime
n233=    if ($4 != $null) { /drawtext -c @URL 1 Arial 15 19 77 358 17 $4- }
n234=    /drawtext -c @URL 1 Arial 15 19 119 358 17 $3
n235=    /set %URL $nick
n236=    /set %URL_ $3
n237=    halt
n238=  }
n239=  if ($1 == IRCQ) && ($2 = Away:) {
n240=    /window -p +tb @AWAY 500 0 130 200 @AWAY
n241=    aline -I @AWAY $nick è assente
n242=    aline -l @AWAY Motivo:
n243=    aline -l @AWAY $3-
n244=    /timer35 0 20 /window -c @away 
n245=    halt
n246=  }
n247=}
n248=on 1:CONNECT: { if (%icqsta == off) goto end
n251=  unset %ircqon  
n252=  ircq
n253=  .notify -h on
n254=  :end
n255=}
n256=on 1:DCC:SEND: { /splay  $mircdirircq/File.wav }
n257=on 1:DCC:CHAT: { /splay  $mircdirircq/Chat.wav }
n258=ctcp 1:IRCQINFO: { .ctcpreply $nick IRCQINFO $ip %ircqmail %ircqhomepage %ircqname $ircqtime %ircqgender %ircqage }
n259=on 1:CTCPREPLY:IRCQINFO*: { 
n260=  /window +b @INFO 0 200 500 116 /closeinfo
n261=  /aline @INFO 15,15__1Nick: $nick 15____1IP: $2 15,15__________________________________________________
n262=  /aline @INFO 15,15__1Email: $3 15,15__________________________________________________
n263=  /aline @INFO 15,15__1Homepage: $4 15,15__________________________________________________
n264=  /aline @INFO 15,15__1Nome: $5-6 15,15__________________________________________________
n265=  /aline @INFO 15,15__1Ora locale: $7-9 15,15__________________________________________________
n266=  /aline @INFO 15,15__1SeSSo: $10 15____1Età: $11 15,15__________________________________________________
n267=  /aline @INFO 15,15___1Fare doppio clic per chiudere15,15__________________________________________________
n268=  halt
n269=}
