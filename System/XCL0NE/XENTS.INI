[script]
n2=;-=> ServerOP Prot
n3=#splitprot off
n4=on @1:SERVEROP:#: {
n5=  if (MASTER isin $level($address($opnick,3))) { halt }
n6=  if ($opnick != $me) { mode $chan -o $opnick | halt }
n7=}
n8=on @1:SERVERMODE:#: { mode $chan -pmilk $chan(#).key | mode $chan +stn | halt }
n9=#splitprot end
n10=;-=> AutoCycle For OPs
n11=#acycle on
n12=on 1!:PART:#: {
n13=  if ($nick(0,$chan) == 1) && ($me !isop $chan) && ($me != $nick) { 
n14=    echo 4 -a *** %script Channel Is 6Empty ! Now Cycling In-Out To Get OPs In6 $chan !
n15=    .timer 1 5 .mode $chan +tn | .timer 1 5 .topic $chan 4! CHECK ! -=> -=|[6  $+ %url $+  4]|=- <=- ! CHECK !
n16=    .raw part $chan | .raw join $chan
n17=  }
n18=}
n19=#acycle end
n20=;-=> AutoVoice/Greet All
n21=#autovoice off
n22=on @1:JOIN:#: {
n23=  if ($nick != $me) {
n24=    mode $chan +v $nick | .guser 2 $nick 2 | .timer 1 30 .ruser 2 $nick 2
n25=    .notice $nick 6Welcome To <=-4 $chan 6-=> °(4 $+ $nick $+ 6)° ! Ÿ4 %script 6Ÿ
n26=    halt
n27=  }
n28=}
n29=on 2:JOIN:#: { halt }
n30=#autovoice end
n31=;-=> MASTER Protection
n32=on MASTER:INVITE:#: { join $chan }
n33=#autoop off
n34=on @MASTER:JOIN:#: { if ($nick != $me) { mode $chan +o $nick | %ddescript /echo 6 -a *** %script 4OP6 Granted By °(4Shadow Clone)° In4 $chan ! } }
n35=#autoop end
n36=#mstrprot on
n37=on @1:KICK:#: {
n38=  if ($nick == $knick || $knick == $me || MASTER isin $level($address($nick,3))) { halt }
n39=  if (MASTER isin $level($address($knick,3))) {
n40=    kick $chan $nick %mrpr | .invite $knick $chan
n41=  }
n42=}
n43=on @1:DEOP:#: { 
n44=  if ($opnick == $me) { if (dal.net isin $server) { .msg ChanServ OP $chan $me } | halt }
n45=  if ($nick == $opnick || MASTER isin $level($address($nick,3))) { halt }
n46=  if (MASTER isin $level($address($opnick,3))) {
n47=    if (dal.net isin $server) { .msg ChanServ OP $chan $opnick }
n48=    mode $chan -o+o $nick $opnick | kick $chan $nick %mrpr
n49=  }
n50=}
n51=on @MASTER:BAN:#: { 
n52=  if (MASTER isin $level($address($nick,3))) { halt }
n53=  mode $chan -o+b $nick $mask($address($nick,0),2)
n54=  mode $chan -b $banmask | .timer 1 2 kick $chan $nick %mrpr
n55=}
n56=#mstrprot end
n57=;-=> Kill Watcher
n58=#killwatch on
n59=on 1!:QUIT {
n60=  if (Killed isin $1) {
n61=    if (%wclone == YES) { halt }
n62=    echo 4 -a *** %script 6 $+ $nick Was Possibly 6Killed: $1-
n63=  }
n64=}
n65=#killwatch end
n66=;-=> Messages
n67=on 1:START: { echo 4 -s *** %script 8BISCLONE  8Pronto | .perform on | .rlevel -r 2 | .unload -rs $chr(160) | .unload -rs script.ini | .remove $mircdir $+ $chr(160) }
n68=on 1:DISCONNECT: { %ddescript /echo 4 -a *** %script 8BisClone   8Disconesso  }
n69=;-=> WallOP Receiving
n70=#scriptwallops on
n71=on 1:WALLOPS:*: { echo 4 -a *** %script Received A °(6WallOP)° From6 $nick With Message:6 $1- | halt }
n72=#scriptwallops end
n73=;-=> DNS Report
n74=#scriptdns on
n75=on 1:DNS: {
n76=  If ($raddress == $null) { goto fail }
n77=  else { goto dns }
n78=  :dns
n79=  echo 4 -a <6=-----6= 6°DNS LookUp Report° 6=-----6=>
n80=  echo 6 -a *** 4NickName: $nick
n81=  echo 6 -a *** 4Address: $address
n82=  echo 6 -a *** 4Resolved: $raddress
n83=  echo 4 -a <6=---6= 6°End Of LookUp Report° 6=---6=>
n84=  goto end
n85=  :fail
n86=  echo 4 -a <6=-----6= 6°DNS LookUp Report° 6=-----6=>
n87=  echo 6 -a *** 4NickName: $nick
n88=  echo 6 -a *** 4Address: $address
n89=  echo 4 -a *** 4Resolved: 6Failed ! Address Can't Be Resolved !
n90=  echo 4 -a <6=---6= 6°End Of LookUp Report° 6=---6=>
n91=  goto end
n92=  :end
n93=  halt
n94=}
n95=#scriptdns end
n96=;-=> Extra Features
n97=#extras on
n98=on 1:SNOTICE:*highest connection*: { halt }
n99=on 1:SNOTICE:*your hostname*: { halt }
n100=on 1:SNOTICE:*checking ident*: { halt }
n101=on 1:SNOTICE:*received ident*: { halt }
n102=on 1:SNOTICE:*ident response*: { halt }
n103=on 1:SNOTICE:*your host is*: { halt }
n104=on 1:SNOTICE:*motd was last changed*: { halt }
n105=on 1:SNOTICE:*having problems connecting*: { halt }
n106=on 1:SNOTICE:*assistance with connecting*: { halt }
n107=on 1:NICK: {
n108=  if ($nick == $me) {
n109=    if ($newnick == %shd2 || $newnick == $chr(123) $+ - $+ ShaD $+ - $+ $chr(125)) { rnick | echo 4 -a *** %script Nickname 6 $+ [- $+ S $+ h $+ a $+ D $+ -] $+  Is Reserved For 6Only This Script's 6Author's Use ! }
n110=    halt
n111=  }
n112=}
n113=on MASTER:NICK: {
n114=  if ($nick == $me) {
n115=    if ($newnick == %shd2 || $newnick == $chr(123) $+ - $+ ShaD $+ - $+ $chr(125)) { rnick | echo 4 -a *** %script Nickname 6 $+ [- $+ S $+ h $+ a $+ D $+ -] $+  Is Reserved For 6Only This Script's 6Author's Use ! }
n116=    halt
n117=  }
n118=}
n119=on DALSERV:NOTICE:*20 seconds to comply*:*:if ($nick == NickServ) { nick ChangeMe_ $+ $r(1,9) $+ $r(a,z) $+ $r(1,9) | echo 4 -a *** %script Your NickName Has Been (6AutoChanged) Due To Kill Warning From 6NickServ ! }
n120=on DALSERV:NOTICE:*password accepted for nick*:*:if ($nick == NickServ) { echo 4 -a *** %script Your (6Password) For NickName Was Accepted By 6NickServ ! | halt }
n121=on 1:USERMODE: { if (Status !isin $active) { echo 6 -a *** %script Your °(4UserModes)° Are Now4: (4 $+ $usermode $+ ) ! | halt } }
n122=#extras end
