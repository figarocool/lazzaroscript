[aliases]
n0=dccengage {
n1=  window -n @DCC 
n2=  echo @DCC 4DCC Sending $2- to $1
n3=
n4=  socklisten dccwait
n5=  multiwrite server notice $1 : $+ DCC Send $replace($nopath($2-), $chr(32), _) ( $+ $ip $+ )
n6=  multiwrite server privmsg $1 : $+ $chr(1) $+ DCC SEND $replace($nopath($2-), $chr(32), _) $longip($ip) $sock(dccwait).port $file($2-).size $+ $chr(1)
n7=  sockmark dccwait $shortfn($2-)
n8=  echo @DCC 4 DCC Send Request sent.
n9=}
n10=
n11=dccsenddata {
n12=  if (%dccack == $file(%filename).size) {
n13=    return 0
n14=  }
n15=  elseif (%dccsent <= $calc($file(%filename).size - 1024)) {
n16=    bread %filename %dccsent 1024 &dcc
n17=    sockwrite dcc &dcc
n18=    inc %dccsent 1024
n19=    return 1
n20=  }
n21=  else {
n22=    bread %filename %dccsent 1024 &dcc
n23=    inc %dccsent $bvar(&dcc,0)
n24=    sockwrite dcc &dcc
n25=    return 1
n26=  }
n27=}

[script]
n0=on 1:socklisten:dccwait:{
n1=  set %filename $sock(dccwait).mark
n2=  sockaccept dcc
n3=  sockclose dccwait
n4=  echo @DCC 4 DCC Send connection accepted.
n5=
n6=  set %dccsent 0
n7=  :debut
n8=  if ($dccsenddata == 0) sockclose dcc
n9=}
n10=
n11=on 1:sockread:dcc:{
n12=  if ($sockerr > 0) {
n13=    echo 4 -i2t @DCC error $sockerr
n14=    return
n15=  }
n16=  sockread -f &temp
n17=  set -u0 %dccack $calc($bvar(&temp,1)*256^3 + $bvar(&temp,2)*256^2 + $bvar(&temp,3)*256 + $bvar(&temp,4))
n18=  if ($dccsenddata == 0) {
n19=    echo @DCC Sent: %dccsent   Ack: %dccack
n20=    sockclose dcc
n21=    echo @DCC 4DCC Send finished.
n22=  }
n23=  else { 
n24=    echo @DCC Sent: %dccsent   Ack: %dccack
n25=  }
n26=}
n27=
n28=on 1:sockclose:dcc:{
n29=  echo @DCC 4DCC Send error
n30=}
n31=
n32=on 1:close:@DCC:{
n33=sockclose dccwait
n34=sockclose dcc
n35=}
