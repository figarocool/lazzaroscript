[aliases]
n0=multiconnect {
n1=  window -ke @Status
n2=  if ($1 == $null) { 
n3=    set %server irc.emn.fr
n4=    set %port 6667
n5=  }
n6=  else  {
n7=    set %server $1
n8=    if ($2 == $null) {
n9=      set %port 6667
n10=    } 
n11=    else { 
n12=      set %port $2 
n13=    }
n14=  }
n15=  titlebar @Status : on %server $+ : $+ %port
n16=  sockopen server %server %port
n17=  aline -h $colour(Info) @Status *** Connecting to %server ( $+ %port $+ )
n18=  linesep @Status
n19=  echo $colour(Info2) -e @Status Local host: $host ( $+ $ip $+ )
n20=}
n21=
n22=multiwrite {
n23=  if (%debug == 1) {  
n24=    echo 4 -i2t @Status >> $2- 
n25=  }
n26=  if ($sock($$1) != $null) sockwrite -n $$1 $2-
n27=}
n28=
n29=multiserverprocesswrapper {
n30=  multiserverprocess : $+ %server $1-
n31=}
n32=
n33=multiserverprocess {
n34=  %envoyer = 0
n35=  ;commandes servers
n36=
n37=  if ($1 == ping) {
n38=    set %commande PONG $right($1-,$mid($1-,6,0))
n39=    set %envoyer 1
n40=    echo $colour(Info2) -ei2t @Status  PING? PONG!
n41=  }
n42=  elseif ($1 == error) {
n43=    echo $colour(Info2) -et @Status $multifin($2-)
n44=  }
n45=  elseif ($left($1,1) != :) {
n46=    multiserverprocesswrapper $1-
n47=    halt
n48=  }
n49=  ;commandes users
n50=  elseif ($2 == join) {
n51=    set %nick $multiextractnick($1)
n52=    set %host $multiextracthost($1)
n53=    set %channel $multifin($3)
n54=    set %fenetre @ $+ $lower(%channel) $+ : $+ %server
n55=    if (%nick == %me) {
n56=      window -kel11S %fenetre
n57=      set %names. [ $+ [ $lower(%channel) ] ] 1
n58=      if (%rejoin == $null) {
n59=        echo $colour(Join) -i2t %fenetre *** Now talking in %channel
n60=      }
n61=      else {
n62=        echo $colour(Join) -i2t %fenetre *** Rejoined channel %channel
n63=        dline -l %fenetre 1 $+ - $+ $line(%fenetre,0,1)
n64=        unset %rejoin
n65=      }
n66=    }
n67=    else {
n68=      aline -l %fenetre %nick
n69=      echo $colour(Join) -t %fenetre *** %nick ( $+ %host $+ ) has joined %channel
n70=    }
n71=    unset %channel
n72=    unset %fenetre
n73=  }
n74=  elseif ($2 == part) {
n75=    set %nick $multiextractnick($1)
n76=    set %host $multiextracthost($1)
n77=    set %fenetre @ $+ $lower($3) $+ : $+ %server
n78=    if (%nick == %me)  window -c %fenetre
n79=    else {
n80=      multideletenick %fenetre %nick
n81=      echo $colour(Part) -t %fenetre *** %nick ( $+ %host $+ ) has left $3 ( $+ $multifin($4-) $+ )
n82=    }
n83=    unset %fenetre
n84=    unset %nick
n85=    unset %host
n86=  }
n87=  elseif ($2 == kick) {
n88=    set %nick $multiextractnick($1)
n89=    set %channel $lower($3)
n90=    set %fenetre @ $+ %channel $+ : $+ %server
n91=    set %strtemp ( $+ $multifin($5-) $+ )
n92=    if ($4 == %me)  {
n93=      echo $colour(Kick) -i2t %fenetre *** You were kicked by %nick %strtemp
n94=      echo $colour(Info) -i2t %fenetre *** Attempting to rejoin...
n95=      echo $colour(Kick) -ei2t @Status  *** You were kicked from %channel by %nick %strtemp
n96=      set %envoyer 1
n97=      set %commande join %channel
n98=      set %rejoin 1
n99=    }
n100=    else {
n101=      multideletenick %fenetre $4
n102=      echo $colour(Kick) -i2t %fenetre *** $4 was kicked by %nick %strtemp
n103=    }
n104=    unset %fenetre
n105=    unset %nick
n106=    unset %channel
n107=  }
n108=  elseif ($2 == quit) {
n109=    multiprocessquit %server $multiextractnick($1) $multiextracthost($1) $multifin($3-)
n110=  }
n111=  elseif ($2 == nick) {
n112=    multiprocessnick %server $multiextractnick($1) $multifin($3-)
n113=  }
n114=  ;Names
n115=  elseif ($2 == 353) {
n116=    set -u0 %strtemp $multifin($6-)
n117=    set -u0 %channel $lower($5)
n118=    if (%names. [ $+ [ %channel ] ] == $null) goto finnames
n119=
n120=    set %cmpt $numtok(%strtemp,32)
n121=    :debutnames
n122=    aline -l @ $+ %channel $+ : $+ %server $gettok(%strtemp,%cmpt,32)
n123=    dec %cmpt
n124=    if (%cmpt > 0) goto debutnames
n125=    unset %cmpt
n126=
n127=    :finnames
n128=    echo $colour(Normal) -i $+ $calc($len(%channel) + 1) $+ t @Status %channel %strtemp
n129=  }
n130=
n131=  ;end of names
n132=  elseif ($2 == 366) {
n133=    echo $colour(Normal) -i2t @Status $4 End of /NAMES list.
n134=    linesep @Status
n135=    unset %names. [ $+ [ $lower($4) ] ]
n136=  }
n137=  elseif ($2 == privmsg) {
n138=    multiprocessprivmsg %server $multiextractnick($1) $3 $multifin($4-)
n139=  }
n140=  elseif ($2 == notice) {
n141=    multiprocessnotice %server $multiextractnick($1) $3 $multifin($4-)
n142=  }
n143=  elseif ($2 == mode) {
n144=    multiprocessmode $1-
n145=  }
n146=  elseif ($2 == topic) {
n147=    set -u0 %window @ $+ $lower($3) $+ : $+ %server 
n148=    echo $colour(Topic) -t %window *** $multiextractnick($1) changes topic to ' $+ $multifin($4-) $+ '
n149=    titlebar %window $multifin($4-)
n150=  }
n151=  ;Nickname already in use
n152=  elseif ($2 == 433) {
n153=    echo -i2t @Status $4 $multifin($5-)
n154=    if ($3 == *) {
n155=      set %me %me $+ _
n156=      echo 4 -i2t @Status  Trying %me
n157=      set %commande nick %me
n158=      set %envoyer 1
n159=    }
n160=  }
n161=  ;whois-whowas stuff
n162=  elseif ($2 == 311) {
n163=    linesep @Status
n164=    echo $colour(Whois) @Status $4 is $5 $+ @ $+ $6 $7 $multifin($8-)
n165=    set %multiwhois 1
n166=  }
n167=  elseif ($2 == 319) {
n168=    echo $colour(Whois) @Status $4 on $multifin($5-)
n169=  }
n170=  elseif ($2 == 312) {
n171=    echo $colour(Whois) @Status $4 using $5 $multifin($6-)
n172=  }
n173=  elseif (($2 == 318) || ($2 == 369)) {
n174=    echo $colour(Whois) @Status $4 $multifin($5-)
n175=    linesep @Status
n176=    unset %multiwhois
n177=  }
n178=  elseif ($2 == 317) {
n179=    echo $colour(Whois) @Status $4 has been idle $duration($5)
n180=  }
n181=
n182=  elseif ($2 == 314) {
n183=    linesep @Status
n184=    echo $colour(Whois) @Status $4 was $5 $+ @ $+ $6 $7 $multifin($8-)
n185=  }
n186=  ; end whois-whowas
n187=
n188=  ; is away
n189=  elseif ($2 == 301) {
n190=    if (%multiwhois == 1) echo $colour(Whois) @Status $4 is away: $multifin($5-)
n191=    else echo $colour(Whois) -e @Status $4 is away: $multifin($5-)
n192=  }
n193=
n194=  ; no such nick channel
n195=  elseif ($2 == 401) {
n196=    linesep @Status
n197=    echo $colour(Whois) @Status $4 $multifin($5-)
n198=  }
n199=
n200=  ;unknown command
n201=  elseif ($2 == 421) {
n202=    echo $colour(Normal) @Status $upper($4) $multifin($5-)
n203=  }
n204=
n205=  ; a la connection
n206=  elseif ($2 == 375) {
n207=    linesep @Status    
n208=    aline -h $colour(Normal) @Status Message of the Day, $5
n209=    linesep @Status
n210=  }
n211=  elseif (($2 == 372) || ($2 == 377)) {
n212=    aline -h $colour(Normal) @Status $multifin($4-)
n213=  }
n214=  elseif (($2 == 255) || ($2 == 266)) {
n215=    aline -h $colour(Normal) @Status $multifin($4-)
n216=    linesep @Status
n217=  }
n218=  ;end of /MOTD
n219=  elseif ($2 == 376) {
n220=    aline -h $colour(Normal) @Status $multifin($4-)
n221=    linesep @Status
n222=    set %commande mode %me +i
n223=    set %envoyer 1
n224=  }
n225=  elseif (($2 == 001) || ($2 == 002) || ($2 == 003)) {
n226=    aline -h $colour(Normal) @Status $multifin($4-)
n227=  }
n228=  elseif ($2 == 004) {
n229=    aline -h $colour(Normal) @Status $4-
n230=  }
n231=  elseif (($2 == 251) || ($2 == 265)) {
n232=    linesep @Status
n233=    aline -h $colour(Normal) @Status $multifin($4-)
n234=  }
n235=  elseif (($2 == 252) || ($2 == 253) || ($2 == 254)) {
n236=    aline -h $colour(Normal) @Status $4 $multifin($5-)
n237=  }
n238=  ;end connection
n239=
n240=  elseif (($2  == 307) || ($2 == 313) || ($2 == 310) || ($2 == 437)) {
n241=    echo $colour(Normal) @Status $4 $multifin($5-)
n242=  }
n243=
n244=  ;topic
n245=  elseif ($2 == 332) {
n246=    set -u0 %channel $lower($4)
n247=    set -u0 %window @ $+ %channel $+ : $+ %server
n248=    echo $colour(Topic) -t %window *** Topic is ' $+ $multifin($5-) $+ '
n249=    titlebar %window $multifin($5-)
n250=  }
n251=  elseif ($2 == 333) {
n252=    set -u0 %window @ $+ $lower($4) $+ : $+ %server
n253=    echo $colour(Topic) -t %window *** Set by $5 on $asctime($6, ddd mmm dd HH:nn:ss)
n254=  }
n255=  ;You're not channel operator
n256=  elseif ($2 == 482) {
n257=    aline -h $colour(Normal) @Status $4 $multifin($5-)
n258=  }
n259=
n260=  ;No such channel
n261=  elseif ($2 == 403) {
n262=    linesep @Status
n263=    aline -h $colour(Normal) @Status $4 $multifin($5-)
n264=    linesep @Status
n265=  }
n266=  ;They aren't on that channel
n267=  elseif ($2 == 441) {
n268=    aline -h $colour(Normal) @Status $4 $5 $multifin($6-)
n269=  }
n270=
n271=  ;Can't change mode for other users (502) + bad username (468)
n272=  elseif (($2 == 502) || ($2 == 468)) {
n273=    aline -h $colour(Normal) @Status $multifin($4-)
n274=  }
n275=
n276=  else echo $colour(Normal) -t @Status $1-
n277=  ;echo -t @Status $1-
n278=
n279=  if (%envoyer == 1) {
n280=    multiwrite server %commande
n281=    unset %commande
n282=  }
n283=  unset %envoyer
n284=}
n285=; end of multiserverprocess
n286=
n287=multiuserprocess {
n288=  if ($left($2,1) == /) {
n289=    %commande = $remove($2-,/)
n290=
n291=    if ($left(%commande,1) == j) {
n292=      if ($left($3,1) == $chr(35)) set -u0 %chan $3
n293=      else set -u0 %chan $chr(35) $+ $3
n294=      set %commande join %chan
n295=    }
n296=    elseif ($left(%commande,4) == part) {
n297=      window -c @ $+ $lower($3) $+ : $+ %server
n298=    }
n299=    elseif ($left(%commande,2) == me) {
n300=      set %commande privmsg $multiextractchannel($1) :ACTION $3- $+ 
n301=      echo $colour(Action) -i2t $1 * %me $3-
n302=    }
n303=    elseif ($left(%commande,3) == msg) {
n304=      if ($4 == $null) {
n305=        multiwritewindow $colour(Info) $1 * /msg: insufficient parameters
n306=        unset %commande
n307=      }
n308=      else {
n309=        set %commande privmsg $3 : $+ $4-
n310=        multiwritewindow $colour(Own) $1 -> * $+ $3 $+ * $4-
n311=      }
n312=    }
n313=    elseif ($left(%commande,8) == describe) {
n314=      if ($4 == $null) {
n315=        multiwritewindow $colour(Info) $1 * /describe: insufficient parameters
n316=        unset %commande
n317=      }
n318=      else {
n319=        set %commande privmsg $3 :ACTION $4- $+ 
n320=      }
n321=    }
n322=    elseif ($left(%commande,6) == notice) {
n323=      if ($4 == $null) {
n324=        multiwritewindow $colour(Info) $1 * /notice: insufficient parameters
n325=        unset %commande
n326=      }
n327=      else {
n328=        set %commande notice $3 : $+ $4-
n329=        multiwritewindow $colour(Own) $1 -> - $+ $3 $+ - $4-
n330=      }
n331=    }
n332=    elseif ($left(%commande,4) == quit) {
n333=      set %commande quit : $+ $3-
n334=    }
n335=    elseif ($left(%commande,3) == say) {
n336=      set %commande privmsg $multiextractchannel($1) : $+ [ [ $3- ] ]
n337=      echo $colour(Own) -i2t $1 < $+ %me $+ > [ [ $3- ] ]
n338=    }
n339=    elseif ($left(%commande,4) == kick) {
n340=      set %commande kick $3 $4 : $+ $5-
n341=    }
n342=    elseif ($left(%commande,7) == onotice) {
n343=      if (#* iswm $2) { 
n344=        set -u0 %window @ $+ $lower($2) $+ : $+ %server
n345=        set -u0 %msg $4-
n346=      }
n347=      else {
n348=        set -u0 %window $1
n349=        set -u0 %msg $3-
n350=      }
n351=
n352=      if ($left($line(%window,$multifindnick(%window,%me),1),1) != @) {
n353=        multiwritewindow $colour(Info) $1 * /onotice: must be an Op on $multiextractchannel(%window)
n354=        return
n355=      }
n356=      set -u0 %cmpt $fline(%window,@*,0,1)
n357=      unset %multidest
n358=
n359=      :noticedebut
n360=      if (%cmpt == 0) goto noticefin
n361=      set -u0 %multinick $remove($line(%window,$fline(%window,@*,%cmpt,1),1),@)
n362=      if (%multinick != %me) set -u0 %multidest %multidest $+ , $+ %multinick
n363=      dec -u0 %cmpt
n364=      goto noticedebut
n365=
n366=      :noticefin
n367=      multiwritewindow $colour(Own) $1 -> Ops $multiextractchannel(%window) $+ : %msg
n368=      set %commande notice %multidest : $+ %msg
n369=    }
n370=    ;end of onotice
n371=    elseif ($left(%commande,4) == ctcp) {
n372=      if ($4 == ping) {
n373=        set %commande privmsg $3 : $+ PING $ctime $+ 
n374=        multiwritewindow $colour(CTCP) $1 -> [ $+ $3 $+ ] PING
n375=      }
n376=      elseif ($4 == dcc) {
n377=        multiwritewindow $colour(Info) $1 * /ctcp : use /dcc command
n378=        unset %commande
n379=      }
n380=      else {
n381=        if ($5 == $null) set %commande privmsg $3 : $+ $upper($4) $+ 
n382=        else set %commande privmsg $3 : $+ $upper($4) $5- $+ 
n383=        multiwritewindow $colour(CTCP) $1 -> [ $+ $3 $+ ] $upper($4) $5-
n384=      }
n385=    }
n386=    elseif ($left(%commande,3) == dcc) {
n387=      if ($numtok(%commande,32) == 1) {
n388=        multiwritewindow $colour(Info) $1 * /dcc: insufficient parameters
n389=        unset %commande
n390=      }
n391=      elseif ($3 == chat) multiprocessdccchat $1 $4
n392=      elseif ($3 == send) multiprocessdccsend $1 $4-
n393=      else {
n394=        multiwritewindow $colour(Info) $1 * /dcc: invalid parameters
n395=        unset %commande
n396=      }
n397=    }
n398=    multiwrite server %commande
n399=    unset %commande
n400=  }
n401=  elseif ($1 == @Status) {
n402=    multiwritewindow $colour(Info) @Status *** You're not on a channel
n403=  }
n404=  else {
n405=    multiwrite server privmsg $multiextractchannel($1) : $+ $2-
n406=    echo $colour(Own) -i2t $1 < $+ %me $+ > $2-
n407=  }
n408=}
n409=
n410=multiextractnick {
n411=  if ($pos($1,!,0) == 0) return $multifin($1)
n412=  else return $mid($1,2,$calc($pos($1,!)-2))
n413=}
n414=
n415=multiextracthost {
n416=  return $right($1,$calc($len($1) - $pos($1,!)))
n417=}
n418=
n419=multiextractchannel {
n420=  return $mid($1,2,$calc($pos($1,:) - 2)))
n421=}
n422=multiextractserver {
n423=  return $right($1,$calc($len($1) - $pos($1,:)))
n424=}
n425=
n426=multideletenick {
n427=  if ($fline($1,$2,0,1) != 0) set %num $fline($1,$2,1,1)
n428=  else {
n429=    set %nicktemp ? $+ $2
n430=    set %num $fline($1,%nicktemp,1,1)
n431=    unset %nicktemp
n432=  }
n433=  dline -l $1 %num
n434=  unset %num
n435=}
n436=
n437=multiprocessquit {
n438=  echo $colour(Quit) -et @Status  *** $2 ( $+ $3 $+ ) Quit ( $+ $4- $+ )
n439=
n440=  set -u0 %strtemp @#* $+ $1
n441=  set -u0 %nbwind $window(%strtemp,0)
n442=  if (%nbwind == 0) return
n443=  set -u0 %cmpt 1
n444=
n445=  :debut
n446=  set -u0 %window $window(%strtemp,%cmpt)
n447=
n448=  set %num -1
n449=  if ($fline(%window,$2,0,1) != 0) set %num $fline(%window,$2,1,1)
n450=  else {
n451=    set %nicktemp ? $+ $2
n452=    if ($fline(%window,%nicktemp,0,1) != 0)  set %num $fline(%window,%nicktemp,1,1)
n453=    unset %nicktemp
n454=  }
n455=  if (%num != -1) {
n456=    dline -l %window %num
n457=    echo $colour(Quit) -t %window *** $2 has quit IRC ( $+ $4- $+ )
n458=  }
n459=  unset %num
n460=
n461=  if (%cmpt == %nbwind) return
n462=  inc %cmpt
n463=  goto debut
n464=}
n465=
n466=multiprocessnick {
n467=  if ($2 == %me) {
n468=    multiwritewindow $colour(Nick) @Status *** Your nick is now $3
n469=    set %me $3
n470=  }
n471=  set -u0 %strtemp @#* $+ $1
n472=  set -u0 %nbwind $window(%strtemp,0)
n473=  if (%nbwind == 0) goto suite
n474=  set -u0 %cmpt 1
n475=
n476=  :debut
n477=  set -u0 %window $window(%strtemp,%cmpt)
n478=
n479=  if ($fline(%window,$2,0,1) != 0) {
n480=    rline -l %window $fline(%window,$2,1,1) $3
n481=    multiwritewindow $colour(Nick) %window *** $2 is now known as $3
n482=  }
n483=  else {
n484=    set %nicktemp ? $+ $2
n485=    if ($fline(%window,%nicktemp,0,1) != 0)  {
n486=      set -u0 %num $fline(%window,%nicktemp,1,1)
n487=      set %char $left($line(%window,%num,1),1)
n488=      rline -l %window %num %char $+ $3
n489=      multiwritewindow $colour(Nick) %window *** $2 is now known as $3
n490=      unset %char
n491=    }
n492=    unset %nicktemp
n493=  }
n494=
n495=  if (%cmpt == %nbwind) goto suite
n496=  inc %cmpt
n497=  goto debut
n498=
n499=  :suite
n500=  set -u0 %window1 @ $+ $lower($2) $+ : $+ %server
n501=  set -u0 %window2 @ $+ $lower($3) $+ : $+ %server
n502=  if ($window(%window1,0) == 0) return
n503=  renwin %window1 %window2 
n504=}
n505=
n506=multiprocessmode {
n507=  if ($left($3,1) == $chr(35)) {
n508=    set %nick $multiextractnick($1)
n509=    set -u0 %window @ $+ $lower($3) $+ : $+ %server
n510=
n511=    set %cmpt 1
n512=    set %currp 5
n513=
n514=    :loop
n515=    set %curr $mid($4,%cmpt,1)
n516=    if (%curr == +) { set %add 1 }
n517=    elseif (%curr == -) { set %add  0 }
n518=    elseif (%curr == b) { inc %currp }
n519=    elseif (%curr == o) {
n520=      set %opped $gettok($1-,%currp,32)
n521=      if (%add == 1) {
n522=        set %opped2 @ $+ %opped
n523=      } 
n524=      else { 
n525=        set %opped2 %opped 
n526=      }
n527=      rline -l %window $multifindnick(%window,%opped) %opped2
n528=      inc %currp
n529=      unset %opped*
n530=    }
n531=    elseif (%curr == v) {
n532=      set %opped $gettok($1-,%currp,32)
n533=      set %num $multifindnick(%window,%opped)
n534=      if ($left($line(%window,%num,1),1) != @) {
n535=        if (%add == 1) {
n536=          set %opped2 + $+ %opped
n537=        } 
n538=        else { 
n539=          set %opped2 %opped 
n540=        }
n541=        rline -l %window %num %opped2
n542=      }
n543=      inc %currp
n544=      unset %num
n545=      unset %opped*
n546=    }
n547=    elseif (%curr == l) { inc %currp }
n548=    elseif (%curr == k) { inc %currp }
n549=    if (%cmpt < $len($4)) {
n550=      inc %cmpt
n551=      goto loop
n552=    }
n553=    unset %curr
n554=    unset %currp
n555=    unset %cmpt
n556=    multiwritewindow $colour(Mode) %window *** %nick sets mode: $4 $5-
n557=  }
n558=  else { multiwritewindow $colour(Mode) @Status *** $3 sets mode: $multifin($4) }
n559=
n560=}
n561=
n562=multiprocessprivmsg {
n563=  if (($left($4-,1) == ) && ($4 != ACTION)) {
n564=    if ($pos($4-,,0) == 1) {
n565=      set -u0 %str $multifin($4-)
n566=    }
n567=    else {
n568=      set -u0 %str $mid($4-,2,$calc($pos($4-,,2) - 2))
n569=    }
n570=
n571=    set -u0 %type $upper($gettok(%str,1,32))
n572=    set -u0 %str $deltok(%str,1,32)
n573=
n574=    if (%type == VERSION) {
n575=      set  %reply Multiserver Add-On $multiversion for mIRC $+ $bits v $+ $version by Flash - Get it at http://come.to/multiserver !
n576=    }
n577=    if (%type == PING) {
n578=      set %reply %str
n579=      unset %str
n580=    }
n581=    if (%type == TIME) {
n582=      set %reply $fulldate
n583=    }
n584=    if (%type == FINGER) {
n585=      set %reply %ircname ( $+ $email $+ ) Idle $idle seconds
n586=    }
n587=    if (%type == DCC) {
n588=      ;      multidccprocess %str
n589=      set %reply DCC not implemented yed
n590=    }
n591=    multiwritewindow $colour(CTCP) @Status [ $+ $2 %type $+ ] %str
n592=    if (%reply != $null) {
n593=      set %commande notice $2 : $+  $+ %type %reply $+ 
n594=      set %envoyer 1
n595=      unset %reply
n596=    }
n597=  }
n598=  else {
n599=    if ($4 == ACTION) {
n600=      if ($pos($4-,,0) == 1) {
n601=        set %n $mid($4-,9,0)
n602=      }
n603=      else {
n604=        set %n $calc($pos($4-,,2) - 9)
n605=      }
n606=      set %msg * $2 $mid($4-,9,%n)
n607=      set -u0 %colour $colour(Action)
n608=      unset %n
n609=    }
n610=    else {
n611=      set %msg < $+ $2 $+ > $4-
n612=      set -u0 %colour $colour(Normal)
n613=    }
n614=    if ($left($3,1) == $chr(35)) {
n615=      ; $3 est le channel ou le gars parle
n616=      multiwritewindow %colour @ $+ $lower($3) $+ : $+ $1 %msg
n617=    }
n618=    else {
n619=      ; $2 est celui qui envoie le msg
n620=      set %window @ $+ $lower($2) $+ : $+ $1
n621=      if ($window(%window,0) == 0) {
n622=        window -ken %window
n623=      }
n624=      multiwritewindow %colour %window %msg
n625=    }
n626=    unset %window
n627=    unset %msg
n628=  }
n629=}
n630=
n631=multiprocessnotice {
n632=  if ($left($4-,1) == ) {
n633=    ; ctcp reply
n634=    if ($pos($4-,,0) == 1) {
n635=      set -u0 %str $multifin($4-)
n636=    }
n637=    else {
n638=      set -u0 %str $mid($4-,2,$calc($pos($4-,,2) - 2))
n639=    }
n640=    set -u0 %type $upper($gettok(%str,1,32))
n641=    set -u0 %str $deltok(%str,1,32)
n642=    if (%type == PING) {
n643=      set -u0 %str $duration($calc($ctime - %str))
n644=    }
n645=    multiwritewindow $colour(CTCP) @Status  [ $+ $2 %type reply]: %str
n646=  }
n647=  ; notice
n648=  else {
n649=    if ($left($3,1) == $chr(35)) {
n650=      ; notice dans un channel
n651=      set -u0 %channel $lower($3)
n652=      multiwritewindow $colour(Notice) @ $+ %channel $+ : $+ $1 - $+ $2 $+ : $+ %channel $+ - $4-
n653=    }
n654=    elseif ($4 == DCC) {
n655=      multiwritewindow $colour(Notice) @Status  - $+ $2 $+ - $4-
n656=    }
n657=    elseif (($left($active,1) == @) && ($multiextractserver($active) == %server) && ($multifindnick($active,$2) != $null)) {
n658=      ; notice d'un user sur le channel actif
n659=      multiwritewindow $colour(Notice) $active - $+ $2 $+ - $4-
n660=    }
n661=    else {
n662=      ; notice d'un user => recherche de tous les channels ou il est...
n663=      set -u0 %strtemp @#* $+ $1
n664=      set -u0 %nbwind $window(%strtemp,0)
n665=      set -u0 %ok 0
n666=      if (%nbwind != 0) {
n667=        set -u0 %cmpt 1
n668=
n669=        :debut
n670=        set -u0 %window $window(%strtemp,%cmpt)
n671=
n672=        if ($multifindnick(%window,$2) != $null) {
n673=          multiwritewindow $colour(Notice) %window - $+ $2 $+ - $4-
n674=          set -u0 %ok 1
n675=        }
n676=
n677=        if (%cmpt == %nbwind) goto fin
n678=        inc %cmpt
n679=        goto debut
n680=        :fin
n681=      }
n682=      ; si aucun alors affichage sur @Status
n683=      if (%ok == 0) multiwritewindow $colour(Notice) @Status - $+ $2 $+ - $4-
n684=    }
n685=    beep
n686=  }
n687=}
n688=
n689=multidccprocess {
n690=  dialog -m multidccchat multidccchat
n691=}
n692=
n693=multiprocessdccchat {
n694=  multiwritewindow $colour(Info) $1 * /dcc chat Not yet implemented
n695=  unset %commande
n696=}
n697=
n698=multiprocessdccsend {
n699=  if ($alias(testdcc.ini) != $null) {
n700=    if ($exists($3-)) {
n701=      dccengage $2 $3-
n702=    }
n703=    else {
n704=      echo 4 $1 *** Error: Unable to access file ' $+ $nopath($3-) $+ '
n705=    }
n706=  }
n707=  else multiwritewindow $colour(Info) $1 * /dcc send Not yet implemented
n708=  unset %commande
n709=}
n710=
n711=multifindnick {
n712=  if ($fline($1,$2,0,1) != 0) set -u0 %num $fline($1,$2,1,1)
n713=  else {
n714=    set %nicktemp ? $+ $2
n715=    set -u0 %num $fline($1,%nicktemp,1,1)
n716=    unset %nicktemp
n717=  }
n718=  return %num
n719=}
n720=
n721=multifin {
n722=  set -u0 %result $right($1-,$calc($len($1-) - 1))
n723=  if (%result == $null) set -u0 %result 2-
n724=  return %result
n725=}
n726=
n727=multiwritewindow {
n728=  if ($2 == @Status) echo $1 -ei2t @Status  $3-
n729=  else echo $1 -i2t $2 $3-
n730=}
n731=
n732=multiversion {
n733=  return 0.25
n734=}
n735=
n736=multiselectednick {
n737=  set -u0 %tmp $sline($1,1)
n738=  if ($pos(%tmp,@,1) == 1 || $pos(%tmp,+,1) == 1) {
n739=    set %tmp $multifin(%tmp)
n740=  }
n741=  return %tmp
n742=}
n743=
n744=multiaffichedefaut {
n745=  set %fin $findtok($1-,$wildtok($1-,:*,1,32),1,32)
n746=  echo [ $ $+ %fin $+ - ]
n747=  return $gettok($1-,[ %fin $+ - ],32) 
n748=}

[script]
n0=on 1:sockopen:server:{
n1=  if ($sockerr > 0) {
n2=    echo 4 -i2t @Status error 
n3=    return
n4=  }
n5=  set %commande nick %me
n6=  multiwrite server %commande
n7=  set %commande user %username $host %server : $+ %ircname
n8=  multiwrite server %commande
n9=}
n10=
n11=on 1:sockread:server:{
n12=  if ($sockerr > 0) {
n13=    echo 4 -i2t @Status error $sockerr
n14=    return
n15=  }
n16=  :nextread
n17=  sockread %temp
n18=
n19=  if (%temp == $null) %temp = -
n20=  if ($sockbr == 0) return
n21=
n22=  multiserverprocess %temp
n23=  unset %temp
n24=
n25=  goto nextread
n26=}
n27=
n28=on 1:sockclose:server:{
n29=  echo @Status 2*** Disconnected
n30=
n31=  ; affichage dans chaque fenetre de "Disconnected"
n32=  set -u0 %strtemp @#* $+ %server
n33=  set -u0 %nbwind $window(%strtemp,0)
n34=  if (%nbwind != 0) {
n35=    set -u0 %cmpt 1
n36=
n37=    :debut
n38=    set -u0 %window $window(%strtemp,%cmpt)
n39=    echo %window 2*** Disconnected
n40=
n41=    if (%cmpt == %nbwind) goto fin
n42=    inc %cmpt
n43=    goto debut
n44=    :fin
n45=  }
n46=}
n47=
n48=on 1:close:@* $+ %server:{
n49=  if ($target == @Status) {
n50=    if ($sock(server).status == active) multiwrite server quit :Leaving
n51=    sockclose server
n52=  }
n53=  if ($left($target,2) == @#) {
n54=    multiwrite server part $multiextractchannel($target)
n55=  }
n56=}
n57=
n58=on 1:input:@ $+ * $+ %server:{
n59=  multiuserprocess $target $1-
n60=  halt
n61=}
n62=menu @#* {
n63=  dclick:{
n64=    set %tmp $lower($line($active,$1,1))
n65=    if ($pos(%tmp,@,1) == 1 || $pos(%tmp,+,1) == 1) {
n66=      set %tmp $multifin(%tmp)
n67=    }
n68=    set %window @ $+ %tmp $+ : $+ %server
n69=    if ($window(%window,0) == 0) {
n70=      window -ke %window
n71=    }
n72=    unset %tmp
n73=  }
n74=  Whois:multiuserprocess $active /whois $multiselectednick($active)
n75=  Query:halt
n76=  UCentral:halt
n77=  -
n78=  Control
n79=  .Ignore:halt
n80=  .Op:multiuserprocess $active /mode $multiextractchannel($active) +o $multiselectednick($active)
n81=  .Deop:multiuserprocess $active /mode $multiextractchannel($active) -o $multiselectednick($active)
n82=  .Kick:multiuserprocess $active /kick $multiextractchannel($active) $multiselectednick($active)
n83=  .Kick (why):multiuserprocess $active /kick $multiextractchannel($active) $multiselectednick($active) $$?="Reason for kick:"
n84=  .Ban:halt
n85=  .Ban, Kick:halt
n86=  CTCP
n87=  .Ping:multiuserprocess $active /ctcp $multiselectednick($active) ping
n88=  .Finger:multiuserprocess $active /ctcp $multiselectednick($active) finger
n89=  .Version:multiuserprocess $active /ctcp $multiselectednick($active) version
n90=  .Time:multiuserprocess $active /ctcp $multiselectednick($active) time
n91=  .Userinfo:multiuserprocess $active /ctcp $multiselectednick($active) userinfo
n92=  .Clientinfo:multiuserprocess $active /ctcp $multiselectednick($active) clientinfo
n93=  DCC
n94=  .Send:multiuserprocess $active /dcc send $multiselectednick($active) $dir="mIRC DCC Send"
n95=  .Chat:multiuserprocess $active /dcc chat $multiselectednick($active)
n96=  -
n97=  Slap!:multiuserprocess $active /me slaps $multiselectednick($active) around a bit with a large trout
n98=  Advert:multiuserprocess $active /me uses Flash's multiserver script  ( available at http://come.to/multiserver ).
n99=}
