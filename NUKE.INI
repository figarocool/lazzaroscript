[aliases]
n0=
n1=/nuke {
n2=  set %nukehost $1
n3=  set %nukeip $2
n4=  set %nukeport $3
n5=  set %nukeprot $4
n6=  set %found 0
n7=  
n8=  if %nukehost == 0  {
n9=    set %nuker *!*@ $+ %nukeip
n10=    scannukeip
n11=  }
n12=  else { 
n13=    set %nuker *!*@ $+ %nukehost
n14=    scannukehost
n15=  }
n16=}
n17=
n18=scannukehost {
n19=  set %num 1
n20=  set %num1 1
n21=  set %nukechans $chan(0)
n22=  set %num2 1
n23=  
n24=  echo -a ATTENZIONE! %nuker ti ha nukkato!
n25=  
n26=  :loopchans
n27=  set %nukechan $chan(%num1)
n28=  set %num 1
n29=  if (%num1 > %nukechans) { goto end }
n30=  echo -a  Ricerca in %nukechan in corso...
n31=  :loopnicks
n32=  set %num2 1
n33=  if ($nick(%num,%nukechan) == $null) {
n34=    inc %num1 1
n35=    goto loopchans
n36=  }
n37=  :loopial
n38=  if ($ial(%nuker,%num2).nick == $nick(%num,%nukechan)) {
n39=    echo 4 -a -- Trovato! : $ial(%nuker,%num2).nick on %nukechan
n40=    if $me isop %nukechan && $ial(%nuker,%num2).nick !isop %nukechan {
n41=      ban -u900 %nukechan $ial(%nuker,%num2).nick 3
n42=      if ((19 isin %nukeport) || (53 isin %nukeport) || (129 isin %nukeport) || (137 isin %nukeport) || (138 isin %nukeport) || (139 isin %nukeport)) {
n43=        kick %nukechan $ial(%nuker,%num2).nick NON TOCCARE LE MIE PORTE !
n44=      }
n45=      if ((1027 isin %nukeport) || (1029 isin %nukeport) || (1032 isin %nukeport))  {
n46=        kick %nukechan $ial(%nuker,%num2).nick NON TOCCARE IL MIO ICQ !
n47=      }
n48=      if ((5000 isin %nukeport) || (50505 isin %nukeport) || (31337 isin %nukeport))  {
n49=        kick %nukechan $ial(%nuker,%num2).nick Backdoor non disponibile :o)
n50=      }
n51=      if (1080 isin %nukeport)  {
n52=        kick %nukechan $ial(%nuker,%num2).nick NON USO SOCKS!!!
n53=      }
n54=      if (21 isin %nukeport)   {
n55=        kick %nukechan $ial(%nuker,%num2).nick Spiacente, FTP Server non disponibile
n56=      }
n57=      kick %nukechan $ial(%nuker,%num2).nick Stay off my ports ! !
n58=    }
n59=    else  {
n60=      set %found 1
n61=    }
n62=  }
n63=  if ($ial(%nuker,%num2).nick == $null) { goto loopnicks1 }
n64=  inc %num2
n65=  goto loopial
n66=  :loopnicks1
n67=  inc %num
n68=  goto loopnicks
n69=  
n70=  :end
n71=  unset %nuker
n72=  unset %num
n73=  unset %num1
n74=  unset %num2
n75=  unset %nukechan
n76=  unset %nukechans
n77=  
n78=  if (%found == 0) {
n79=    set %nuker *!*@ $+ %nukeip
n80=    scannukeip
n81=  }
n82=  
n83=  halt
n84=}
n85=
n86=scannukeip {
n87=  set %num 1
n88=  set %num1 1
n89=  set %nukechans $chan(0)
n90=  set %num2 1  
n91=  echo -a Attenzione! %nuker ti ha nukkato!
n92=  
n93=  :loopchans
n94=  set %nukechan $chan(%num1)
n95=  set %num 1
n96=  if (%num1 > %nukechans) { goto end }
n97=  echo -a  Ricerca in corso su %nukechan
n98=  :loopnicks
n99=  set %num2 1
n100=  if ($nick(%num,%nukechan) == $null) {
n101=    inc %num1 1
n102=    goto loopchans
n103=  }
n104=  :loopial
n105=  if ($ial(%nuker,%num2).nick == $nick(%num,%nukechan)) {
n106=    echo -a -- Trovato! $ial(%nuker,%num2).nick su %nukechan
n107=    if $me isop %nukechan && $ial(%nuker,%num2).nick !isop %nukechan {
n108=      ban -u900 %nukechan $ial(%nuker,%num2).nick 3
n109=      kick %nukechan $ial(%nuker,%num2).nick LASCIA STARE le mie porte!
n110=      set %found 1
n111=    }
n112=    else  {
n113=      set %found 1
n114=    }
n115=  }
n116=  if ($ial(%nuker,%num2).nick == $null) { goto loopnicks1 }
n117=  inc %num2
n118=  goto loopial
n119=  :loopnicks1
n120=  inc %num
n121=  goto loopnicks
n122=  
n123=  :end
n124=  
n125=  if %found == 0 {
n126=    echo -a Non riesco a trovare questo bastardo!
n127=    if (%nukehost != 0) { who %nukehost }
n128=    who %nukeip
n129=  }
n130=  
n131=  unset %nuker
n132=  unset %num
n133=  unset %num1
n134=  unset %num2
n135=  unset %nukechan
n136=  unset %nukechans
n137=  unset %nukehost
n138=  unset %nukeip
n139=  unset %nukeport
n140=  unset %nukeprot
n141=  unset %found
n142=  
n143=  halt
n144=}
