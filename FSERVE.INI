[script]
n0=#fserve.ratio on
n1=on 1:SERV:GET * {
n2=  set %fserve.temp $readini $mircdirservinfo.ini $nick leech
n3=  if (%fserve.temp != yes) {
n4=    if (%fserve.on.off != on) halt
n5=    set %fserve.file $cd $+ \ $+ $parm2
n6=    if ($lof(%fserve.file) == $null) { .msg =$nick $parm2 non esiste. Sintassi del comando: get <nomefile> | halt }
n7=    set %fserve.temp $readini $mircdirservinfo.ini $nick credits
n8=    if ($lof(%fserve.file) > %fserve.temp) { .msg =$nick Hai solo %fserve.temp bytes di crediti, te ne sono necessari almeno $lof(%fserve.file) ! Per ottenerli inviami altri file | halt }
n9=    else { dec %fserve.temp $lof(%fserve.file) | .msg =$nick Invio in corso di $$2 $+ , se l'invio riesce avrai %fserve.temp bytes di crediti }
n10=    unset %fserve.temp
n11=  }
n12=}
n13=on 1:FILERCVD:* {
n14=  if (%fserve.on.off != on) halt
n15=  if ($fserv($nick) == $null) halt
n16=  set %fserve.info.rcvd.nick $nick
n17=  set %fserve.info.rcvd.file $nopath($filename) ( $+ $lof($filename) $+ )
n18=  set %fserve.temp $readini $mircdirservinfo.ini $nick leech
n19=  if (%fserve.temp == yes) {
n20=    .msg =$nick Grazie per la tua donazione, ricorda che hai accesso illimitato | goto end
n21=  }
n22=  else {
n23=    set %fserve.temp $readini $mircdirservinfo.ini $nick credits
n24=    %fserve.temp2 = %fserve.ratio * $lof($filename)
n25=    inc %fserve.temp %fserve.temp2
n26=    writeini $mircdirservinfo.ini $nick credits %fserve.temp
n27=    fserve.bytes rcvd $lof($filename)
n28=    .msg =$nick Ora hai un credito di $readini $mircdirservinfo.ini $nick credits
n29=  }
n30=  :end
n31=  unset %fserve.temp  %fserve.temp2
n32=}
n33=on 1:FILESENT:* {
n34=  if (%fserve.on.off != on) halt
n35=  if ($fserv($nick) == $null) halt
n36=  set %fserve.info.sent.file $nopath($filename) ( $+ $lof($filename) $+ )
n37=  set %fserve.info.sent.time $time
n38=  set %fserve.info.sent.nick $nick
n39=  set %fserve.temp $readini $mircdirservinfo.ini $nick leech
n40=  if (%fserve.temp == yes) {
n41=    .msg =$nick Hai accesso illimitato! | goto end
n42=  }
n43=  else {
n44=    set %fserve.temp $readini $mircdirservinfo.ini $nick credits
n45=    dec %fserve.temp $lof($filename)
n46=    writeini $mircdirservinfo.ini $nick credits %fserve.temp
n47=    fserve.bytes sent $lof($filename)
n48=    .msg =$nick Ora hai un credito di $readini $mircdirservinfo.ini $nick credits
n49=  }
n50=  :end
n51=  unset %fserve.temp %fserve.temp2
n52=}
n53=on 1:GETFAIL:* {
n54=  if (%fserve.on.off != on) halt
n55=  if ($fserv($nick) == $null) halt
n56=  set %fserve.temp $readini $mircdirservinfo.ini $nick leech
n57=  if (%fserve.temp == yes) { .msg =$nick Il tuo file ( $+ $nopath($filename) $+ ) non è stato correttamente ricevuto | goto end }
n58=  .msg =$nick Il tuo file ( $+ $nopath($filename) $+ ) non è stato completamente ricevuto, per ricevere crediti lo dovrai rinviare.
n59=  set %fserve.info.error DCC GET di $nopath($filename) da $nick fallito
n60=  :end
n61=  unset %fserve.temp
n62=}
n63=on 1:SENDFAIL:* {
n64=  if (%fserve.on.off != on) halt
n65=  if ($fserv($nick) == $null) halt
n66=  set %fserve.temp $readini $mircdirservinfo.ini $nick leech
n67=  if (%fserve.temp == yes) { .msg =$nick Il file ( $+ $nopath($filename) $+ ) non ti è stato inviato completamente | goto end }
n68=  .msg =$nick Il file ( $+ $nopath($filename) $+ ) non ti è stato inviato completamente, il tuo credito non sarà sottratto per quello che è stato inviato, puoi riprovare a scaricare $nopath($filename) $+ .
n69=  set %fserve.info.error DCC SEND di $nopath($filename) a $nick fallito.
n70=  :end
n71=  unset %fserve.temp
n72=}
n73=#fserve.ratio end
n74=#fserve off
n75=on 1:TEXT:%fserve.trigger:# {
n76=  if ($fserv($nick) != $null) halt
n77=  if ($fserve.ban($address($nick,3)) == yes) { .notice $nick sei stato escluso da questo fserve, ignorato per 1 minuto | echo -a Utente Escluso dal FServer ( $+ $nick $+ ) ha cercato di accedere al fileserver, ignorato per 1 minuto | .ignore -u60 $address($nick,3) | halt }
n78=  if (%fsrvdir == $null) { set %fsrvdir fserve }
n79=  fserve $nick 20 %fsrvdir $mircdirfileserver\welcome.txt
n80=}
n81=on 1:SERV:help:/msg = $+ $nick Ora hai $readini $mircdirservinfo.ini $nick credits crediti! FileServeR PoWeReD by %script 2None Site of Internet 8,2
n82=on 1:SERVOPEN {
n83=  if ($address($nick,1) == $null) { notice $nick devi restare in questo canale finché non si avvia il fserver | close -f $nick }
n84=  if ($fserve.leech($address($nick,3)) == yes) { writeini $mircdirservinfo.ini $nick leech yes | .msg =$nick Hai accesso illimitato! }
n85=  else { writeini $mircdirservinfo.ini $nick leech no }
n86=  set %fserve.nicks.open %fserve.nicks.open $nick
n87=  set %fserve.info.open.nick $nick
n88=  set %fserve.info.open.time $time
n89=  writeini $mircdirservinfo.ini $nick credits 0
n90=}
n91=on 1:FILERCVD:* {
n92=  if ($fserv($nick) == $null) halt
n93=  set %fserve.info.rcvd.nick $nick
n94=  set %fserve.info.rcvd.file $nopath($filename) ( $+ $lof($filename) $+ )
n95=  set %fserve.info.rcvd.time $time
n96=  fserve.bytes rcvd $lof($filename)
n97=}
n98=on 1:FILESENT:* {
n99=  if ($fserv($nick) == $null) halt
n100=  set %fserve.info.sent.nick $nick
n101=  set %fserve.info.sent.file $nopath($filename) ( $+ $lof($filename) $+ )
n102=  set %fserve.info.sent.time $time
n103=  fserve.bytes sent $lof($filename)
n104=}
n105=on 1:GETFAIL:* {
n106=  if ($fserv($nick) == $null) halt
n107=  msg =$nick Il tuo file ( $+ $nopath($filename) $+ ) non è stato ricevuto completamente.
n108=  set %fserve.info.error DCC GET di $nopath($filename) da $nick fallito.
n109=}
n110=on 1:SENDFAIL:* {
n111=  if ($fserv($nick) == $null) halt
n112=  msg =$nick Il file ( $+ $nopath($filename) $+ ) non ti è stato completamente inviato.
n113=  set %fserve.info.error DCC SEND di $nopath($filename) a $nick fallito.
n114=}
n115=#fserve end
