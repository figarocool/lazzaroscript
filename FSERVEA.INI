[aliases]
n0=/LazZaro.fserve {
n1=  if ($1 == $null) { if (%fserve.on.off != ON) goto on | else goto off }
n2=  if ($1 == on) { goto on }
n3=  elseif ($1 == off) { goto off }
n4=  :on
n5=  if (%fserve.on.off == on) { halt }
n6=  if (%fserve.trigger == $null) { set %fserve.trigger !fserve }
n7=  if (%fserve.ratio == $null) { set %fserve.ratio 4 }
n8=  if (%fsrvdir == $null) { set %fsrvdir $mircdirfileserver }
n9=  .timer97 0 1 fnc
n10=  set %fserve.info.open.nick nessuno | set %fserve.info.open.time mai
n11=  set %fserve.info.close.nick nessuno | set %fserve.info.close.time mai
n12=  set %fserve.info.rcvd.file nulla | set %fserve.info.rcvd.nick nessuno
n13=  set %fserve.info.sent.file nulla | set %fserve.info.sent.nick nessuno
n14=  writeini $mircdirservinfo.ini bytes sent 0
n15=  writeini $mircdirservinfo.ini bytes rcvd 0
n16=  set %fserve.info.error nessuno
n17=  .enable #fserve
n18=  set %fserve.on.off ON
n19=  window -l @Fserve 9999 9999 250 150 /fserve.command $mircdirfservepop.txt arial 9
n20=  fserve.window
n21=  .timer888 0 1 fserve.window
n22=  goto end
n23=  :off | if (%fserve.on.off == off) { halt } | window -c @fserve | .disable #fserve | set %fserve.on.off OFF | .timer97 off | goto end
n24=  :end
n25=  echo -a Fserve  $+ %fserve.on.off $+ 
n26=}
n27=/fserve.make.sure {
n28=  if ($window(@Fserve) != $null) || (%fserve.on.off != on) { goto done } | .disable #fserve | set %fserve.on.off OFF | :done
n29=}
n30=/fserve.bytes {
n31=  if ($$1 == rcvd) {
n32=    set %fserve.bytes.rcvd $readini $mircdirservinfo.ini bytes rcvd
n33=    inc %fserve.bytes.rcvd $$2
n34=    writeini $mircdirservinfo.ini bytes rcvd %fserve.bytes.rcvd
n35=    unset %fserve.bytes.rcvd
n36=  }
n37=  if ($$1 == sent) {
n38=    set %fserve.bytes.sent $readini $mircdirservinfo.ini bytes sent
n39=    inc %fserve.bytes.sent $$2
n40=    writeini $mircdirservinfo.ini bytes sent %fserve.bytes.sent
n41=    unset %fserve.bytes.sent
n42=  }
n43=}
n44=/fserve.window {
n45=  if ($window(@Fserve) == $null) { /LazZaro.fserve off | halt }
n46=  /rline @Fserve 1 Comando: %fserve.trigger
n47=  if (%fserve.ratio.on.off == off) { rline @Fserve 2 Rapporto: disattivato }
n48=  else { rline @Fserve 2 Rapporto: 1: $+ %fserve.ratio }
n49=  /rline @Fserve 3 Cartella: %fsrvdir
n50=  /rline @Fserve 4 Ultimo Aperto: %fserve.info.open.nick %fserve.info.open.time
n51=  /rline @Fserve 5 Ultimo Chiuso: %fserve.info.close.nick %fserve.info.close.time
n52=  /rline @Fserve 6 Ultimo Ricevuto: %fserve.info.rcvd.file da %fserve.info.rcvd.nick
n53=  /rline @Fserve 7 Ultimo Inviato: %fserve.info.sent.file a %fserve.info.sent.nick
n54=  /rline @Fserve 8 Bytes Inviati: $readini $mircdirservinfo.ini bytes inviati
n55=  /rline @Fserve 9 Bytes Ricevuti: $readini $mircdirservinfo.ini bytes ricv
n56=  /rline @Fserve 10 Ultimo Errore: %fserve.info.error
n57=}
n58=/fserve.ban {
n59=  if ($exists($mircdirfserveban.txt) == $false) { write -c $mircdirfserveban.txt | return no }
n60=  set %fs 0
n61=  :start
n62=  inc %fs 1
n63=  set %fs.temp $read -l $+ %fs $mircdirfserveban.txt
n64=  if (%fs.temp == $null) { unset %fs | unset %fs.temp | return no }
n65=  if ($$1 iswm %fs.temp) { unset %fs | unset %fs.temp | return yes }
n66=  goto start
n67=}
n68=/fserve.ban.add {
n69=  if ($fserve.ban($$1) == yes) {
n70=    echo -a Questo utente è già escluso
n71=    halt
n72=  }
n73=  if ($fserve.leech($$1) == yes) {
n74=    echo -a Impossibile escludere questo utente, ha accesso illimitato | halt
n75=  }
n76=  write $mircdirfserveban.txt $$1
n77=  echo -a Escluso l'indirizzo: $$1 (non ha effetto se è già in un fserve)
n78=}
n79=/fserve.ban.remove {
n80=  if ($fserve.ban($$1) == no) { echo -a Questo utente non è escluso | halt }
n81=  write -ds $+ $$1 $mircdirfserveban.txt
n82=  echo -a Riammesso l'indirizzo: $$1
n83=}
n84=/fserve.leech {
n85=  if ($exists($mircdirfserveleech.txt) == $false) { write -c $mircdirfserveleech.txt | return no }
n86=  set %fs 0
n87=  :start
n88=  inc %fs 1
n89=  set %fs.temp $read -l $+ %fs $mircdirfserveleech.txt
n90=  if (%fs.temp == $null) { unset %fs | unset %fs.temp | return no }
n91=  if ($$1 iswm %fs.temp) { unset %fs | unset %fs.temp | return yes }
n92=  goto start
n93=}
n94=/fserve.leech.add {
n95=  if ($fserve.leech($$1) == yes) { echo -a Questo utente ha già accesso illimitato | halt }
n96=  if ($fserve.ban($$1) == yes) { echo -a Impossibile consentire l'accesso illimitato a questo utente, è escluso dal fserve | halt }
n97=  write $mircdirfserveleech.txt $$1
n98=  echo -a Accesso illimitato consentito all'indirizzo: $$1 (non ha effetto se è già in un fserve)
n99=}
n100=/fserve.leech.remove {
n101=  if ($fserve.leech($$1) == no) { echo -a Questo utente non ha accesso illimitato | halt }
n102=  write -ds $+ $$1 $mircdirfserveleech.txt
n103=  echo -a Revocato l'accesso illimitato all'indirizzo: $$1 (non ha effetto se è già in un fserve)
n104=}
n105=/fnc {
n106=  set %fnc 0
n107=  :start
n108=  inc %fnc 1
n109=  set %fnc.nick $gettok(%fserve.nicks.open,%fnc,32)
n110=  if (%fnc.nick == $null) goto done
n111=  if ($fserv(%fnc.nick) == $null) {
n112=    set %fserve.nicks.open $remtok(%fserve.nicks.open,%fnc.nick,32)
n113=    set %fserve.info.close.nick %fnc.nick
n114=    set %fserve.info.close.time $time
n115=    writeini $mircdirservinfo.ini %fnc.nick credits 0
n116=  }
n117=  goto start
n118=  :done
n119=  unset %fnc %fnc.nick
n120=}
n121=/fserve.ratio {
n122=  if (%fserve.ratio.on.off == ON) goto off | set %fserve.ratio.on.off ON | .enable #fserve.ratio | goto end | :OFF | set %fserve.ratio.on.off OFF | .disable #fserve.ratio | :end | echo -a RapportiFServe   $+ %fserve.ratio.on.off $+ 
n123=}
n124=/fserve.ratio.set {
n125=  set %fserve.ratio $?="Immettere il rapporto (predef. 4):" | if (%fserve.ratio == $null) set %fserve.ratio 4 | echo -a Rapporto FServe impostato ad 1 a  $+ %fserve.ratio $+ 
n126=}
n127=/fserve.trigger.set {
n128=  set %fserve.trigger $?="Immettere il comando, es !fserve" | if (%fserve.trigger == $null) set %fserve.trigger !fserve | echo -a Comando FServe impostato a  $+ %fserve.trigger $+ 
n129=}
n130=/fserve.crd.add {
n131=  set %fserve.temp $readini $mircdirservinfo.ini $$1 credits
n132=  inc %fserve.temp $$2
n133=  writeini $mircdirservinfo.ini $$1 credits %fserve.temp
n134=  unset %fserve.temp
n135=}
n136=/fserve.crd.sub {
n137=  set %fserve.temp $readini $mircdirservinfo.ini $$1 credits
n138=  dec %fserve.temp $$2
n139=  writeini $mircdirservinfo.ini $$1 credits %fserve.temp
n140=  unset %fserve.temp
n141=}
