[script]
n0=on ^*:JOIN:#:{
n1=  echo 3 -t $chan *** $nick ( $+ $address $+ ) si è presentato pur'isse
n2=  haltdef
n3=}
n4=on ^*:BAN:#:echo 3 -t $chan *** $nick ( $+ $address $+ ) non vo' chiù vede': $banmask | haltdef
n5=on ^*:UNBAN:#:echo 3 -t $chan *** $nick ( $+ $address $+ ) vuole ancora bene : $banmask | haltdef
n6=on ^*:op:#:echo 3 -t $chan *** $nick ha dato un pezzo e' core  a $opnick | haltdef
n7=on ^*:deop:#:echo 3 -t $chan *** $nick fa il guappo e' cartone con $opnick | haltdef
n8=on ^*:voice:#:echo 3 -t $chan *** $nick ha dato la croce a $vnick | haltdef
n9=on ^*:devoice:#:echo 3 -t $chan *** $nick ha tolto sta croce a $vnick | haltdef
n10=on ^*:serverop:#:echo 3 -t $chan *** $opnick ( $+ $address $+ ) ha avuto 'a grazia dal server $nick | haltdef
n11=on ^*:INVITE:#:/echo 6 -at *** $nick ( $+ $address $+ ) te sta a  chiamma' su $chan
n12=on ^*:KICK:#:/echo 2 -t $chan *** $nick s'è pigliat la questione con $knick: $1- | haltdef
n13=on ^*:MODE:#:/echo 3 -t $chan *** $nick pazzea in gopp o canale: $1- | haltdef
n14=on ^*:SERVERMODE:#:/echo 3 -t $chan *** Il server $nick pazzea pur'isso in gopp o canale: $1- | haltdef
n15=on ^*:NICK:/echo 3 -at *** $nick mo' se fa chiama' $newnick | haltdef
n16=on ^*:PART:#:/echo 3 -t $chan *** $nick ( $+ $address $+ ) nun è chiu' in gopp o' canale: $1- | haltdef
n17=on ^*:QUIT:{
n18=  %tmp.x = 1
n19=  :nextcomch
n20=  echo 2 -t $comchan($nick,%tmp.x) *** $nick ( $+ $address $+ ) è 'ito fuienn' a  IRC: $1-
n21=  inc %tmp.x 1
n22=  if (%tmp.x <= $comchan($nick,0)) goto nextcomch
n23=  /echo 2 -st *** $nick ( $+ $address $+ ) è 'ito fuienn' a IRC: $1- | unset %tmp.x | haltdef
n24=}
n25=on ^*:TOPIC:#:/echo $chan 3 *** $nick ha pensato buono di cambiare o'topic !! : $1- | haltdef
