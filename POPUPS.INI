n208=  if (%i == $len(%text1col)) { set %textcol $remove(%textcol,$chr(32))
n209=    set %textcol $replace(%textcol,,$chr(32)) | say %textcol
n210=    unset %i %textcol %text1col %frontcol %backcol %rc
n211=    halt
n212=  }
n213=  goto rep
n214=}
