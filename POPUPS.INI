n188=..RainbowTalk: {
n189=  set %rainbow.msg $$?="Enter Your Rainbow Text? (no numbers):"
n190=  if ($len(%rainbow.msg) >= 52) { echo 4 *** %sd Your Rainbow Text Was Too Long ! Max 52 Characters ! | halt }
n191=  else { set %length $len(%rainbow.msg) } | set %cycles 1
n192=  :next
n193=  if ($mid(%cycles,1,%rainbow.msg) == $null) { goto done }
n194=  if ($mid(%cycles,1,%rainbow.msg) == $chr(32)) { set %rainbow.str $chr(3) $+ $r(1,9) $+ $chr(160) $+ $chr(3) }
n195=  else { set %rainbow.str $chr(3) $+ $r(1,9) $+ $mid(%cycles,1,%rainbow.msg) $+ $chr(3) }
n196=  set %rainbow %rainbow %rainbow.str | inc %cycles 1 | goto next
n197=  :done
n198=  %rainbow = $remove(%rainbow,$chr(32)) | say %rainbow
n199=  unset %rainbow %rainbow.msg %rainbow.str %cycles %length
n200=}
