n60=.Votazioni
n61=..Vota: {
n62=  if (%vote.topic != $null) { echo 4 -a ERRORE: Puoi fare solo una votazione alla volta... | halt }
n63=  set %vote.chan $chan
n64=  set %vote.topic $?="cosa vuoi votare?"
n65=  set %vote.duration $?="Per quanti secondi?"
n66=  if (%vote.topic == $null || %vote.duration == $null) { unset %vote.* | halt }
n67=  set %vote.yes 0
n68=  set %vote.no 0
n69=  set %vote.total 0
n70=  if ($chan(%vote.chan) == $null) { echo 4 -a ERRORE: Non sei sul canale di voto %vote.chan | unset %vote.* | halt }
n71=  msg %vote.chan 6Votazioni per %vote.chan aperte.
n72=  msg %vote.chan 12OGGI SI VOTA SU: %vote.topic
n73=  msg %vote.chan 2Scrivete SI o NO. ( $+ $duration(%vote.duration) per votare) %sd
n74=  .timer 1 %vote.duration vote.timesup
n75=  set %vote.timer $ltimer
n76=}
n77=..Annulla: {
n78=  if (%vote.topic != $null) {
n79=    .timer [ $+ [ %vote.timer ] ] off
n80=    if ($chan(%vote.chan) == $null) { echo 6 -a Votazione annullata | echo 4 -a ERRORE: Impossibile visualizzare i risultati, non sei su %vote.chan | goto end }
n81=    msg %vote.chan 6Votazione Annullata
n82=    msg %vote.chan 12OGGI SI VOTA SU : %vote.topic
n83=    msg %vote.chan 2Voti SI:4 %vote.yes 2(12 $+ $vote.percent(%vote.yes,%vote.total) $+ 2)
n84=    msg %vote.chan 2Voti NO:4 %vote.no 2(12 $+ $vote.percent(%vote.no,%vote.total) $+ 2)
n85=    if (%vote.no == 0 && %vote.yes == 0) { msg %vote.chan 5Nessuno ha votato... }
n86=    elseif (%vote.no == %vote.yes) { msg %vote.chan 5Parità! }
n87=    elseif (%vote.no > %vote.yes) { msg %vote.chan 5La maggioranza ha votato NO %sd }
n88=    elseif (%vote.no < %vote.yes) { msg %vote.chan 5La maggioranza ha votato SI %sd }
n89=    :end
n90=    unset %vote.*
n91=  }
n92=  else { echo 4 -a ERRORE: Non c'è nessun voto da annullare... }
n93=}
n94=..Stato: {
n95=  echo 12 -a -
n96=  echo 6 -a Rapporto Votazione
n97=  if (%vote.topic != $null) {
n98=    echo 2 -a Votazione aperta su %vote.chan
n99=    echo 2 -a Si vota su ' $+ %vote.topic $+ '
n100=    echo 2 -a La durata del voto è di ' $+ $duration(%vote.duration) $+ '
n101=    echo 2 -a 2Voti SI:4 %vote.yes 2(12 $+ $vote.percent(%vote.yes,%vote.total) $+ 2)
n102=    echo 2 -a 2Voti NO:4 %vote.no 2(12 $+ $vote.percent(%vote.no,%vote.total) $+ 2)
n103=  }
n104=  else { echo 2 -a Nessuna votazione in corso }
n105=}
