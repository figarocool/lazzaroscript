[script]
n0=; ---> ToolBar n.1 <---
n1=
n2=#barrabo on
n3=on 1:START: bar | bartit | if %abreserverz == on { unset %abreserverz | server }
n4=#barrabo end
n5=;
n6=#barraoff off
n7=on 1:START: baroff | if %abreserverz == on { unset %abreserverz | server }
n8=#barraoff end
n9=
n10=alias bar {
n11=  window -c @1
n12=  window -pk +b @1 0 0 1024 36 @1 | drawpic -s @1 0 0 1024 36 $mircdirtoolbar\ircapb.bmp
n13=  set %bar_T $window(@1).w / 2 | %bar_T = %bar_T - 48 | if ( %bar_T < 385 ) { set %bar_T 385 }
n14=  drawpic @1 %bar_T 0 $mircdirtoolbar\ircapb_t.bmp
n15=  drawpic @1 0 0 $mircdirtoolbar\ircapb_b.bmp
n16=  set %bar_J $window(@1).w | %bar_J = %bar_J - 163 | drawpic @1 %bar_J 0 $mircdirtoolbar\ircapb_j.bmp
n17=  .enable #barrabo | .disable #barraoff
n18=  bodef 284 %bar.p1 | bodef 318 %bar.p2 | bodef 350 %bar.p3
n19=  icobots
n20=  window -a @1
n21=  if $script($mircdirmbar.ini) != $null dibubar 0 36
n22=}
n23=alias baroff {
n24=  window -c @1
n25=  window -pk +b @1 0 0 34 36 @1
n26=  drawpic -s @1 0 0 $mircdirtoolbar\ircapb_b.bmp
n27=  .enable #barraoff | .disable #barrabo
n28=  window -a @1
n29=  if $script($mircdirmbar.ini) != $null dibubar 35 0
n30=}
n31=
n32=menu @1 {
n33=  sclick {
n34=    if ( $mouse.x > 6  ) && ( $mouse.x < 25 ) { 
n35=      if ( $group(#barrabo) == off ) { bar | bartit }
n36=      else baroff
n37=    }
n38=    if ( $mouse.x > 32  ) && ( $mouse.x < 54 ) { run $dir="Esegui applicazione" $mircdir*.exe }
n39=    if ( $mouse.x > 70  ) && ( $mouse.x < 97 ) { echo -se  Se non è presente vattelo a cercare.. | /run C:\Program Files\Signal9\Firewall\Frw.exe | beep }
n40=    if ( $mouse.x > 107  ) && ( $mouse.x < 130 ) { run $mircdirnuke\IGMPNukeV1_0 | beep }
n41=    if ( $mouse.x > 143  ) && ( $mouse.x < 168 ) { /run %amail.proggy | beep }
n42=    if ( $mouse.x > 181  ) && ( $mouse.x < 202 ) { run }
n43=    if ( $mouse.x > 213  ) && ( $mouse.x < 239 ) { 
n44=      ;      if $group(#fservo) == on fservc 
n45=      ;      else { load -rs fserver.ini | fserver }
n46=      if  %fserve.on.off == ON {   iRcLvmfine }
n47=      else { iRcLvmserver   }
n48=    }
n49=    if ( $mouse.x > 247  ) && ( $mouse.x < 270 ) {
n50=      if ($away == $false) {  busy }
n51=      else { unbusy }
n52=    }
n53=    if ( $mouse.x > 286  ) && ( $mouse.x < 309 ) { run $gettok(%bar.p1,2,231) | echo -se  Esecuzione $gettok(%bar.p1,2,231) }
n54=    if ( $mouse.x > 319  ) && ( $mouse.x < 342 ) { run $gettok(%bar.p2,2,231) | echo -se  Esecuzione $gettok(%bar.p2,2,231) }
n55=    if ( $mouse.x > 352  ) && ( $mouse.x < 373 ) { run $gettok(%bar.p3,2,231) | echo -se  Esecuzione $gettok(%bar.p3,2,231) }
n56=
n57=    if ( $mouse.x > %bar_T ) && ( $mouse.x < $calc(%bar_T + 116) ) about
n58=    if ( $mouse.x > %bar_B ) && ( $mouse.x < $calc(%bar_B + 88) ) && ( %bar_B > 0 ) infobots
n59=
n60=    if ( $mouse.x > $calc(%bar_J + 24)) && ( $mouse.x < $calc(%bar_J + 39) ) halt |
n61=    if ( $mouse.x > $calc(%bar_J + 39)) && ( $mouse.x < $calc(%bar_J + 56) ) && ( $len(%uson) > 0 ) {
n62=      echo -se 4,4!8,7 Ricomincio 15,15!1,0 $nopath(%uson)
n63=      bartit
n64=      if .mp3 isin %uson || .vqf isin %uson { run -n %mp3player " $+ %uson $+ " | halt }
n65=      splay stop | .timer -m 1 100 splay " $+ %uson $+ "
n66=    }
n67=    if ( $mouse.x > $calc(%bar_J + 56)) && ( $mouse.x < $calc(%bar_J + 79) ) { 
n68=      if $mouse.y > 27 { set %midirnd - | midirnd | halt }
n69=      splay stop | set %uson $dir="Scegliere un MIDI" [ %mididir $+ *.mid ]  | bartit | sund " $+ %uson $+ "
n70=      echo -se 4,4!8,7 MIDI locale 15,15!1,0 %uson 1,0
n71=    }
n72=    if ( $mouse.x > $calc(%bar_J + 79)) && ( $mouse.x < $calc(%bar_J + 109) ) { 
n73=      set %uson $dir="Scegliere un file audio (WAV)" [ %wavdir $+ *.wav ] | bartit | splay " $+ %uson $+ "
n74=      echo -se 4,4!8,7 WAV locale 15,15!1,0 $remove($nopath(%uson),.wav)
n75=    }
n76=    if ( $mouse.x > $calc(%bar_J + 109)) && ( $mouse.x < $calc(%bar_J + 139) ) { 
n77=      if $mouse.y > 27 {
n78=        run -n %mp3player " $+ $left(%mp3dir,$calc($len(%mp3dir) - 1)) $+ "
n79=        echo -se 4,4!8,7 MP3's aleatorios en1 %mp3dir 15,15!1,0 $findfile(%mp3dir,*.mp3,0) MP3's encontrados | halt
n80=      }
n81=      set %uson $dir="Scegliere un file MP3 o VQF" [ %mp3dir $+ *.mp3;*.vqf;*.m3u ]
n82=      bartit | if %uson == $null halt | run -n %mp3player " $+ %uson $+ "
n83=      echo -se 4,4!8,7 MP3 locale 15,15!1,0  12[3 $+ $replace($replace($duration($calc($lof(%uson) / 16000 )),mins,m),secs,s) 1 3 $round($calc($lof(%uson) / 1048576 ),1) Mb $+ 12]
n84=    /ame  4,4!8,7 MP3 locale 15,15!1,0 6Sta Ascoltando ----> 2,8 $nopath(%uson) 6,0 <----- 12,0[3 $+ $replace($replace($duration($calc($lof(%uson) / 16000 )),mins,m),secs,s) 1 3 $round($calc($lof(%uson) / 1048576 ),1) Mb $+ 12]  }
n85=    if .m3u isin %uson { unset %uson | bartit }
n86=
n87=
n88=    if ( $mouse.x > $calc(%bar_J + 139)) && ( $mouse.x < $calc(%bar_J + 159) ) { 
n89=      run $$dir="Escoge emisora para RealAudio" [ $mircdirtoolbar\radio\ $+ *.ram ]
n90=    }
n91=  }
n92=  ;    echo -s X= $mouse.x -  Y= $mouse.y - J = $calc($mouse.x - %bar_j )
n93=}
n94=menu @1 {
n95=  Pulsanti Personalizzabili
n96=  .Imposta Pulsante n.1 . . .( $gettok(%bar.p1,2,231) ): set %bar.p1 $$?="Nome del pulsante ? (5 lettere)" $+ ç $+ $dir="Scegli Applicazione" c:\ | bar | bartit
n97=  .Imposta Pulsante n.2 . . .( $gettok(%bar.p2,2,231) ): set %bar.p2 $$?="Nome del pulsante ? (5 lettere)" $+ ç $+ $dir="Scegli Applicazione" c:\ | bar | bartit
n98=  .Imposta Pulsante n.3 . . .( $gettok(%bar.p3,2,231) ): set %bar.p3 $$?="Nome del pulsante ? (5 lettere)" $+ ç $+ $dir="Scegli Applicazione" c:\ | bar | bartit
n99=  - 
n100=  File Server
n101=  .Imposta Cartella Iniziale ( attualmente %fsrvdir ):/set %fsrvdir $$?="Inserire la cartella" | /echo - | /echo %sd 6 Cartella Iniziale File Server: | /echo %sd 10 %fsrvdir | /echo -
n102=  .Imposta Max Download Simultanei ( attualmente %fsrvmget ):/set %fsrvmget $$?="Max download simultanei ?" | /echo - | /echo %sd 6 File Server - Max Download Simultanei: | /echo %sd 10 n. %fsrvmget | /echo -
n103=  .Modifica File MOTD:/run notepad $mircdirfileserver\welcome.txt | /echo - | /echo %sd 6 File Server - Modifica file Motd
n104=
n105=}
n106=;
n107=alias bartit {
n108=  if ( $window(@1).state == normal ) {
n109=    drawpic -s @1 %bar_J 0 $mircdirtoolbar\ircapb_j.bmp
n110=    if $len(%uson) < 1 return
n111=    drawtext -c @1 1 Arial 14 $calc(%bar_J + 18) -1 140 20 $nopath(%uson)
n112=  }  
n113=}
n114=
n115=alias bodef {
n116=  set %bancho $width($gettok($$2-,1,231),arial,12,1,0) | if %bancho > 28 { drawtext -c @1 5 Arial 12 $$1 18 28 20 $gettok($$2-,1,231) | unset %bancho | return }
n117=  set %bancho $calc($$1 + 16 - $calc(%bancho / 2) ) | drawtext -c @1 5 Arial 12 %bancho 18 28 20 $gettok($$2-,1,231) | unset %bancho
n118=}
n119=;
n120=alias icobots {
n121=  set %bar_B $calc(%bar_J - %bar_T + 116) | set %bar_B $calc(%bar_B / 2) | set %bar_B $int($calc(%bar_B - 44 + %bar_T))
n122=  ;  if $script(hispano.inb) != $null  {
n123=  drawpic @1 %bar_B 0 $mircdirtoolbar\bothispano.bmp
n124=  ; | return }
n125=  if $script(scytale.inb) != $null  { drawpic @1 %bar_B 0 $mircdirtoolbar\botscytale.bmp | return }
n126=  if $script(dalnet.inb) != $null  { drawpic @1 %bar_B 0 $mircdirtoolbar\botdalnet.bmp | return }
n127=  if $script(undernet.inb) != $null  { drawpic @1 %bar_B 0 $mircdirtoolbar\botundernet.bmp | return }
n128=  ;  drawpic @1 %bar_B 0 0 0 88 36 $mircdirtoolbar\ircapb.bmp | set %bar_b 0
n129=}
n130=;alias fserver {
n131=;  fserve $$?="Inserire il NickName dell'utente che volete far accedere al vostro File Server" %fservlimits %fservhome %fservwelcome
n132=;}
